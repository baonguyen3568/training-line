# Reference pipelines gallery (P4-1, ACCEPTED 2026-10-13). Owner: bao-research. Licences: bao-security verdict below.
# Data for the frontend gallery; no number that was not measured (no times, scores or memory here).
#   kind        app_template = opens in the app (template_id) | candidate = will be rebuilt with app nodes (P4-5)
#               external = reference only: needs nodes/engines the app does not have yet
#   status      available | planned | reference_only
#   license     per part; null = unknown or mixed: the UI shows "see source"
#   steps       mini diagram, in order; `node` = app node type when one exists, else null
#   difficulty  basic | advanced | null (not assessed)
#   notice      text the licence requires next to this pipeline (optional)
#   model_parts parts of the model under another licence (optional)
#   requires_hf_terms  true when the user must accept the model's terms on Hugging Face themself (optional)
#   publisher   who published the source recipe (name shown next to source_url)
#   measured    our own run on one DGX Spark (GB10), or null = "chưa có số đo". Every number cites `sources`
#               (committed repo paths; site gate check_site_numbers). Fields: train_minutes, peak_ram_gb (run.json, whole
#               container), score {benchmark, metric, value, ci95, n} or null, config (what exactly was run), sources.
schema_version: 1
pipelines:
  - id: invoice-to-json
    kind: app_template
    template_id: invoice_to_json
    status: available
    difficulty: basic
    title: {vi: "Đọc hoá đơn → JSON (Nemotron Parse)", en: "Receipts → JSON (Nemotron Parse)"}
    source_url: https://github.com/NVIDIA-NeMo/Automodel/tree/main/examples/vlm_finetune/nemotron
    publisher: "NVIDIA"
    license: {code: apache-2.0, model: nvidia-open-model-license, data: cc-by-4.0}
    model_parts:
      - {part: tokenizer, license: cc-by-4.0}
      - {part: "encoder C-RADIOv2-H", license: nvidia-open-model-license}
    measured:
      train_minutes: 116
      peak_ram_gb: 23.7
      score: {benchmark: "CORD v2 test", metric: field_f1, value: 70.97, ci95: [66.33, 75.38], n: 100}
      config: "3 epochs on the 800 CORD train images, GBS 8, lr 1e-5, FusedAdam fp32 master; image vlm-automodel:26.08-6"
      sources: [benchmarks/eval/p3b-parse-v1.1-cord-test-s299-20261013.json, .team/proposals/001a-nvidia-default-model.md]
    steps:
      - {node: model.hf_pick, label: {vi: "Nemotron Parse v1.1", en: "Nemotron Parse v1.1"}}
      - {node: data.hf_load, label: {vi: "CORD v2", en: "CORD v2"}}
      - {node: train.sft_vlm, label: {vi: "Fine-tune toàn bộ", en: "Full fine-tune"}}
      - {node: eval.benchmarks, label: {vi: "Chấm CORD", en: "Score on CORD"}}

