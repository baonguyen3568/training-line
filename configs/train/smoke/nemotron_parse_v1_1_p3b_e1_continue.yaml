# E1 (001a §10.11, PM 2026-10-13): does Parse v1.1 keep improving past 3 epochs? Continues P-3b
# (run 20261013-1015-p3b-full-parse-c4f6, ckpt epoch_2_step_299) with --restore-from: same model, data, optimizer
# (TE FusedAdam fp32 master) and constant lr, so steps 300-599 = epochs 4-6 of one 6-epoch run. Checkpoints at
# 399/499/599 (every 100 steps; save_consolidated every) are scored on 100 CORD VALIDATION images (paired vs s299);
# test is reported only for the chosen one. ~20 s/step -> ~1h40 + validation. Run with --gate --worktree.

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 100
  val_every_steps: 100
  num_epochs: 6  # explicit: AutoModel default num_epochs=10 silently capped O-1b at 50 of 60 steps
  max_steps: 600

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: PREPARED_MODEL_DIR
  torch_dtype: torch.bfloat16
  use_liger_kernel: false
  attn_implementation: eager
  trust_remote_code: true  # required by upstream recipe; code is pinned + offline (see header)

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: PREPARED_MODEL_DIR
  trust_remote_code: true

checkpoint:
  enabled: true
  checkpoint_dir: RUN_DIR/checkpoints
  model_save_format: safetensors
  save_consolidated: every  # each kept ckpt must be loadable by the eval worker (~2GB each)
  max_recent_checkpoints: 3  # keep 399/499/599 for the E1 decision

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.models.nemotron_parse.nemotron_parse_loss.NemotronParseLoss
  coordinate_weight: 10.0
  class_token_start_idx: 50000
  num_heads: 1
  ignore_index: -100
  fp32_upcast: true

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_cord_v2_dataset
  path_or_dataset: /workspace/.cache/hf/hub/datasets--naver-clova-ix--cord-v2/snapshots/7f0115a4b758a71d6473b8d085751692da2fef98
  split: train

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  pin_memory: false  # UMA: pinned host copies only add RAM (001a §9.1 d)
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.nemotron_parse_collate_fn

validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_cord_v2_dataset
  path_or_dataset: /workspace/.cache/hf/hub/datasets--naver-clova-ix--cord-v2/snapshots/7f0115a4b758a71d6473b8d085751692da2fef98
  split: validation
  limit_dataset_samples: 100

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.nemotron_parse_collate_fn

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 1.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
  eps: 1.0e-8
  adam_w_mode: true
  master_weights: true
  store_param_remainders: true
  exp_avg_dtype: torch.float32
  exp_avg_sq_dtype: torch.float32

freeze_config:  # adapter enforces: freeze encoder.model_encoder (RADIO backbone), neck + decoder + embeddings train (001a §9.3)
  freeze_vision_tower: true
  freeze_language_model: false
