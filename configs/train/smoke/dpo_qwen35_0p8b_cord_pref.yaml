# ADR-022 #7 DPO smoke (research 2026-10-14): Qwen3.5-0.8B LoRA, 20 steps (GBS 4 pairs) on CORD preference pairs
# (outputs/research/dpo/make_cord_pref.py: chosen = ground truth, rejected = 1-2 injected errors, POVID-style), one
# validation on 50 pairs. Run: python -m vlm_pipeline.train.dpo_vlm --config <this> checkpoint.checkpoint_dir=<run>/ckpt
# Checks: the DPO loss falls below log 2 = 0.693, chosen-wins rises, RAM vs the LoRA run, no NaN.

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 4
  local_batch_size: 1
  ckpt_every_steps: 20
  val_every_steps: 20
  num_epochs: 1
  max_steps: 20

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: /workspace/.cache/hf/hub/models--Qwen--Qwen3.5-0.8B/snapshots/2fc06364715b967f1860aea9cf38778875588b17
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch
    rope_fusion: false
  attn_implementation: sdpa
  torch_dtype: bfloat16

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: /workspace/.cache/hf/hub/models--Qwen--Qwen3.5-0.8B/snapshots/2fc06364715b967f1860aea9cf38778875588b17
  min_pixels: 200704  # catalog qwen_pixels (= 196 tokens at patch 16, merge 2)
  max_pixels: 1003520  # without it the processor keeps up to 16.7 MP: ~9.8k tokens for a 2376x4224 receipt

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  match_all_linear: False
  exclude_modules:
    - "*vision_tower*"
    - "*vision*"
    - "*visual*"
    - "*image_encoder*"
    - "*lm_head*"
    - "*audio*"
  dim: 8
  alpha: 32
  use_triton: True

checkpoint:
  enabled: true
  checkpoint_dir: RUN_DIR/checkpoints
  model_save_format: safetensors
  save_consolidated: final
  max_recent_checkpoints: 2

distributed:
  _target_: nemo_automodel.components.distributed.fsdp2.FSDP2Manager
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: true

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: vlm_pipeline.train.dpo_vlm.make_preference_dataset
  path_or_dataset: /workspace/outputs/research/dpo/cord_pref
  split: train

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  collate_fn:
    _target_: vlm_pipeline.train.dpo_vlm.dpo_collate_fn

validation_dataset:
  _target_: vlm_pipeline.train.dpo_vlm.make_preference_dataset
  path_or_dataset: /workspace/outputs/research/dpo/cord_pref
  split: validation
  limit_dataset_samples: 50

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  collate_fn:
    _target_: vlm_pipeline.train.dpo_vlm.dpo_collate_fn

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 2.0e-5  # LoRA DPO range 5e-6..5e-5
  weight_decay: 0.01


dpo:
  beta: 0.1
  sft_weight: 0.0
