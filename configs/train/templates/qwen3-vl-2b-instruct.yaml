# Train template for catalog id `qwen3-vl-2b-instruct` (owner: bao-research). Read by src/vlm_pipeline/train/recipe.py, which
# overrides node-controlled fields (paths, batch, epochs, lr preset, seed, ckpt, LoRA/full, freeze); everything
# else (loss, collate, attn, pixels, pin_memory, val limit) is taken verbatim from here.
# Model: Qwen/Qwen3-VL-2B-Instruct@89644892e4d85e24eaac8bacfd4f463576704203 (vetted, configs/catalog/models.yaml). Derived from: templates/cosmos-reason2-2b.yaml (upstream qwen3_vl_*_instruct_rdr recipes).
# Status: UNTESTED on GB10

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 4
  local_batch_size: 1
  ckpt_every_steps: 10
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 30

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: /workspace/.cache/hf/hub/models--Qwen--Qwen3-VL-2B-Instruct/snapshots/89644892e4d85e24eaac8bacfd4f463576704203
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch
    rope_fusion: false
  attn_implementation: sdpa
  torch_dtype: bfloat16

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: /workspace/.cache/hf/hub/models--Qwen--Qwen3-VL-2B-Instruct/snapshots/89644892e4d85e24eaac8bacfd4f463576704203
  min_pixels: 200704  # 256*28*28
  max_pixels: 1003520  # 1280*28*28

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  match_all_linear: False
  exclude_modules:
    - "*vision_tower*"
    - "*vision*"
    - "*visual*"
    - "*image_encoder*"
    - "*lm_head*"
    - "*audio*"
  dim: 8
  alpha: 32
  use_triton: True

checkpoint:
  enabled: true
  checkpoint_dir: RUN_DIR/checkpoints
  model_save_format: safetensors
  save_consolidated: final
  max_recent_checkpoints: 2

distributed:
  _target_: nemo_automodel.components.distributed.fsdp2.FSDP2Manager
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: true

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_cord_v2_dataset
  path_or_dataset: /workspace/.cache/hf/hub/datasets--naver-clova-ix--cord-v2/snapshots/7f0115a4b758a71d6473b8d085751692da2fef98
  split: train

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.qwen2_5_collate_fn

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 1.0e-4
  weight_decay: 0.01
