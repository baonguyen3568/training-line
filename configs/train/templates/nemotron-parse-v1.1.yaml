# P-1 smoke (default template candidate, ADR-001 amendment 1): fine-tune NVIDIA Nemotron-Parse-v1.1 on CORD-v2,
# NeMo AutoModel 26.08 (vlm-automodel:26.08-1). Derived from upstream examples/vlm_finetune/nemotron/nemotron_parse_v1_1.yaml
# (same loss / collate / freeze policy); Spark changes: local_batch 1, GBS 8, max_steps 50, ckpt/val cadence for smoke.
# Pinned snapshots (bao-security):
#   nvidia/NVIDIA-Nemotron-Parse-v1.1@fd1e3c6ba0b61a6dcab5a905f0ff92c5b19f14a4 (NVIDIA Open Model License; tokenizer CC-BY-4.0)
#     APPROVED-WITH-CONDITIONS: encoder.auto_map + hf_nemotron_parse_config.py pull nvidia/C-RADIOv2-H code at `main`.
#     -> the launcher's prepare step must point encoder auto_map/_name_or_path at a LOCAL, hash-verified copy of
#        nvidia/C-RADIOv2-H@0d8f4c18 and run with HF_HUB_OFFLINE=1 (same mechanism as the Omni review).
#     PREPARED_MODEL_DIR below = that prepared (patched) snapshot.
#   naver-clova-ix/cord-v2@7f0115a4b758a71d6473b8d085751692da2fef98 (CC BY 4.0, APPROVED)
# Model is ~0.9B: full fine-tune of the decoder only. NOTE: upstream freeze_config does NOT match Parse's `encoder`
# module and `freeze_embeddings` is not a recipe key (001a §9) -> freezing + RADIO fused_attn are enforced by our
# adapter in vlm-automodel:26.08-3, which asserts the trainable fraction at build time.
# Paths are container paths; RUN_DIR and PREPARED_MODEL_DIR are substituted by the launcher.

recipe: FinetuneRecipeForVLM

# Decoding for the Eval / "Try it" nodes (001a §10.7): NOT an AutoModel key -> only run this file via
# train/recipe.py build_recipe (it strips the key), never `automodel <this file>` directly. Applied on top of the base
# generation_config (base -> template -> node param); the export keeps the base generation_config unchanged.
# CORD JSON repeats structural tags by design; the base repetition_penalty 1.1 penalizes them (F1 77.2 -> 40.2, 6 imgs).
decode_overrides:
  repetition_penalty: 1.0

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 25
  val_every_steps: 25
  max_steps: 50  # re-measure run (001a §9.1): launcher overrides to 5 steps, memguard abort < 10GB

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: PREPARED_MODEL_DIR
  torch_dtype: torch.bfloat16
  use_liger_kernel: false
  attn_implementation: eager
  trust_remote_code: true  # required by upstream recipe; code is pinned + offline (see header)

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: PREPARED_MODEL_DIR
  trust_remote_code: true

checkpoint:
  enabled: true
  checkpoint_dir: RUN_DIR/checkpoints
  model_save_format: safetensors
  save_consolidated: final
  max_recent_checkpoints: 2

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.models.nemotron_parse.nemotron_parse_loss.NemotronParseLoss
  coordinate_weight: 10.0
  class_token_start_idx: 50000
  num_heads: 1
  ignore_index: -100
  fp32_upcast: true

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_cord_v2_dataset
  path_or_dataset: /workspace/.cache/hf/hub/datasets--naver-clova-ix--cord-v2/snapshots/7f0115a4b758a71d6473b8d085751692da2fef98
  split: train

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  pin_memory: false  # UMA: pinned host copies only add RAM (001a §9.1 d)
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.nemotron_parse_collate_fn

validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_cord_v2_dataset
  path_or_dataset: /workspace/.cache/hf/hub/datasets--naver-clova-ix--cord-v2/snapshots/7f0115a4b758a71d6473b8d085751692da2fef98
  split: validation
  limit_dataset_samples: 100

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.nemotron_parse_collate_fn

optimizer:  # fp32 master weights: on 1 GPU AutoModel skips FSDP2/mp_policy, plain AdamW on bf16 params loses most
  # updates (001a §10.9; P-3: 5.3% of decoder elements changed). Same block as P-3b-A (configs/train/smoke/
  # nemotron_parse_v1_1_p3b_fp32master.yaml). recipe.py overrides only lr / weight_decay.
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 1.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
  eps: 1.0e-8
  adam_w_mode: true
  master_weights: true
  store_param_remainders: true
  exp_avg_dtype: torch.float32
  exp_avg_sq_dtype: torch.float32

freeze_config:  # adapter enforces: freeze encoder.model_encoder (RADIO backbone), neck + decoder + embeddings train (001a §9.3)
  freeze_vision_tower: true
  freeze_language_model: false
