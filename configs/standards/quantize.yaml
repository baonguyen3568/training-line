# Quantization standards (P4-2 §2.4), phase `validate`.
# Schema: nodes/standards.py (bao-cleancode). Each rule: one level (error|warn|info), one `check` (discriminated by kind),
# message in the `standards.` i18n namespace, non-empty source (repo paths must exist). Owner of content: bao-research.
# Hard limits of the quantize worker (format vs model, vision / KV-cache quantization, calibration wire) are NOT
# here: validate calls quantize.scope.check_support directly (b563b29), one source with the worker. This file keeps
# recommendations and rules that are not about worker support. The calib size has no rule: the param only offers
# 128 | 512, both fine (A/B 2026-10-13, .team/proposals/001-stack-model-catalog.md B-4).
schema_version: 1
rules:
  - id: QUANT-CALIB-NOT-HELDOUT
    applies_to: {node: quantize.modelopt_ptq, port: calib_data}
    check: {kind: dataset_split_not_heldout}
    level: error
    message: standards.quant.calib_from_heldout
    source: "docs/adr/ADR-002-eval-benchmark-protocol.md; configs/catalog/datasets.yaml heldout_splits"

  - id: QUANT-EVAL-DOWNSTREAM
    applies_to: {node: quantize.modelopt_ptq}
    check: {kind: reaches_node, target: eval.benchmarks}
    level: warn  # PM 2026-10-13: experts may quantize and score elsewhere; every quantize template has the step
    message: standards.quant.eval_downstream
    source: "the in-node parity check is a sanity check on 16 images, not a score; quality gate = configs/eval/gates.yaml quant_vs_parent"
