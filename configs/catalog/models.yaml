# Model catalog (data, not code). Owner: bao-research. Source of truth: ADR-001 + amendment 1,
# .team/proposals/001-stack-model-catalog.md, .team/proposals/001a-nvidia-default-model.md.
# Licence/remote-code verdicts: bao-security (configs/security/licenses.yaml, .team/security-reviews/).
# Adding a model = new entry + security vet + recursive auto_map/_name_or_path scan (scripts/research/hf_model_meta.py).
#
# Field conventions (flat on purpose, consumed by nodes as per-model defaults):
#   display_name        proper name only, language-neutral; descriptions live in i18n model_catalog.<id>.tagline (vi/en)
#   ("needs a free machine" is NOT stored: UI derives it from ram_gb_train vs live MemAvailable at preflight)
#   revision            40-char commit SHA vetted by bao-security (never `main`)
#   tier                default | template | catalog | baseline | rnd   (rnd = never shown in Simple)
#   train_node          train.sft_vlm | train.lora_vlm | none          (what the "Tự động" template choice maps to)
#   ram_gb_train        UPPER bound used by preflight for the default train_node (GB, whole job incl. CUDA on UMA)
#   ram_source          measured | estimated   (estimated -> UI shows "ước lượng")
#   sft_trainable_pct_min/max  expected % of trainable params for train.sft_vlm after our freeze policy
#                       (asserted at build by the adapter); 0/0 = no expectation measured yet (adapter warns)
#   image_policy        fixed | qwen_pixels | token_budget   (decides which image widget/param exists; parity key)
#                         fixed        -> fixed_image_hw set, min/max_pixels = 0, image_max_tokens = 0
#                         qwen_pixels  -> min_pixels/max_pixels set (smart_resize), fixed_image_hw = []
#                         token_budget -> image_max_tokens set (Gemma 4 max_soft_tokens), pixels 0, fixed_image_hw = []
#   image_max_tokens    per-image visual token budget (token_budget only; 0 otherwise)
#   quant_fp8           official | experimental | unsupported   (Quantize node hidden unless official)
#   serve_engine        vllm | hf | unknown   (default engine for the "Chạy thử" node)
#   remote_code         none | pinned_prepared   (pinned_prepared = runs only from the hash-verified prepared snapshot)
#   security            approved | approved_with_conditions | conditional | rejected
schema_version: 1
budget_note: "RAM budget on the shared GB10 is ~40GB; preflight = ram_gb_train + 10GB headroom vs MemAvailable."
models:
  - id: nemotron-parse-v1.1
    repo: nvidia/NVIDIA-Nemotron-Parse-v1.1
    revision: fd1e3c6ba0b61a6dcab5a905f0ff92c5b19f14a4
    display_name: "NVIDIA Nemotron Parse v1.1"
    vendor: nvidia
    tier: default
    gated: false
    remote_code: pinned_prepared   # config/processor .py + C-RADIOv2-H@0d8f4c18 (configs/models/pinned/)
    license: nvidia-open-model-license
    commercial: "yes"
    attribution: "NVIDIA Open Model License; tokenizer CC-BY-4.0"
    security: approved
    params_b: 0.94
    disk_gb: 3.8
    train_node: train.sft_vlm      # full fine-tune of the decoder, vision + embeddings frozen (upstream recipe)
    ram_gb_train: 35
    ram_source: measured           # P-1 26.08-2 startup peak +35GB WITH freeze/fused-attn bugs (001a §9); re-measure after fix
    sft_trainable_pct_min: 29.4
    sft_trainable_pct_max: 31.4
    attn: eager
    loss: nemotron_parse           # NemotronParseLoss, coord weight 10, threshold read from config (fixcode patch)
    freeze_vision_tower: true      # = RADIO backbone only (encoder.model_encoder); neck trains (001a §9.3)
    image_policy: fixed
    image_max_tokens: 0
    min_pixels: 0
    max_pixels: 0
    fixed_image_hw: [2048, 1648]
    video: false
    video_fps: 0
    min_answer_tokens: 1536        # CORD JSON length - verify at P-2
    quant_fp8: experimental        # P-5 spike pending -> Quantize node hidden
    serve_engine: unknown          # vLLM support checked at P-4; fallback hf
    task_prompt_fixed: true        # "Trích xuất hoá đơn" (no free-form question)
    gallery_gates: [white_image_probe, train_serve_parity, nvidia_golden, cord_field_f1]
    min_image: vlm-automodel:26.08-2   # needs normalize patch + albumentations/cv2

