# NTC-Training (ADR-015, Release 1.0 A3). `docker compose up -d` after scripts/install.sh wrote .env.local.
# Security conditions (release §A): every port on 127.0.0.1; vlm-runner is the ONLY service with the docker socket;
# no service mounts the repo root; non-root, read-only root fs, cap_drop ALL, no-new-privileges; images pinned.
name: ntc-training

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=512m"]
  restart: unless-stopped

services:
  app:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args: {VLM_UID: "${VLM_UID:?run scripts/install.sh}", VLM_GID: "${VLM_GID:?}", VLM_BUILD_COMMIT: "${VLM_BUILD_COMMIT:-}"}
    image: ntc-training-app:local
    user: "${VLM_UID}:${VLM_GID}"
    group_add: ["${VLM_GID}"]  # the runner socket is 0660 runner:<run gid>
    ports: ["127.0.0.1:${VLM_PORT:-7870}:7870"]
    environment:
      VLM_RUNNER_SOCKET: /run/vlm-runner/runner.sock
      VLM_GPU_LOCK_PATH: /run/vlm-lock/GPU_LOCK
      VLM_PROFILE: "${VLM_PROFILE:-}"
      VLM_PUBLIC_PORT: "${VLM_PORT:-7870}"  # the published port: the Host allowlist and the link (listens on 7870)
    volumes:  # data only: the image carries the code (no repo mount)
      - "${VLM_DATA_ROOT:?}/outputs:/app/outputs"  # includes outputs/system: the app is trusted for it (security N2)
      - "${VLM_DATA_ROOT}/.cache:/app/.cache"
      - "${VLM_DATA_ROOT}/data:/app/data"
      - "${VLM_DATA_ROOT}/uploads:/app/uploads"
      - "${VLM_GPU_LOCK_DIR:?}:/run/vlm-lock"  # the app's run_job takes the GPU lock: same host file as the runner's
      - "runner-sock:/run/vlm-runner"
      - "${VLM_POLICY_FILE:?}:/home/app/.config/ntc-training/policy.toml:ro"  # one file, never the folder
      - "${VLM_SECRETS_KEY_FILE:?}:/home/app/.config/ntc-training/secrets.key:ro"
    depends_on: [runner]
    mem_limit: 4g

  runner:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args: {VLM_UID: "${VLM_UID}", VLM_GID: "${VLM_GID}", VLM_BUILD_COMMIT: "${VLM_BUILD_COMMIT:-}"}
    image: ntc-training-runner:local
    user: "${VLM_UID}:${VLM_GID}"
    group_add: ["${DOCKER_GID:?}"]  # the host's docker group: the socket, nothing else
    network_mode: none  # a unix socket needs no network
    environment:
      VLM_HOST_PROJECT_ROOT: "${VLM_HOST_PROJECT_ROOT:?}"
      VLM_DATA_ROOT: "${VLM_DATA_ROOT}"
      VLM_RUNNER_STATE: /var/lib/vlm-runner
      VLM_GPU_LOCK_PATH: /run/vlm-lock/GPU_LOCK
      VLM_RUNNER_ALLOWED_UIDS: "${VLM_UID}"
      VLM_JOB_UID: "${VLM_UID}"
      VLM_JOB_GID: "${VLM_GID}"
      VLM_RUNNER_SECRETS: "${VLM_RUNNER_SECRETS:?}"  # download tokens, one 0400 file per job (host tmpfs)
      VLM_EGRESS_CONTROL: /run/vlm-egress/control.sock  # registers each download job's byte budget
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Same host paths inside the runner: it checks mount sources where the daemon will read them.
      - "${VLM_HOST_PROJECT_ROOT}/src:${VLM_HOST_PROJECT_ROOT}/src:ro"
      - "${VLM_HOST_PROJECT_ROOT}/configs:${VLM_HOST_PROJECT_ROOT}/configs:ro"
      - "${VLM_HOST_PROJECT_ROOT}/docker/IMAGES.lock:${VLM_HOST_PROJECT_ROOT}/docker/IMAGES.lock:ro"
      - "${VLM_HOST_PROJECT_ROOT}/scripts/qa/eval_cord_worker.py:${VLM_HOST_PROJECT_ROOT}/scripts/qa/eval_cord_worker.py:ro"
      # The data dirs only, at their host paths (run logs are appended in run dirs; claims in outputs/system).
      # Never the data root itself: by default it IS the project folder (.env.local, .git).
      - "${VLM_DATA_ROOT}/outputs:${VLM_DATA_ROOT}/outputs"
      - "${VLM_DATA_ROOT}/.cache:${VLM_DATA_ROOT}/.cache:ro"
      - "${VLM_DATA_ROOT}/data:${VLM_DATA_ROOT}/data:ro"
      - "${VLM_DATA_ROOT}/uploads:${VLM_DATA_ROOT}/uploads:ro"
      - "${VLM_GPU_LOCK_DIR}:/run/vlm-lock:ro"  # verifies a GPU job's token, never takes the lock
      - "runner-sock:/run/vlm-runner"
      - "runner-state:/var/lib/vlm-runner"  # started markers + audit: never mounted into the app or a job
      # Host tmpfs at its host path (the daemon binds ONE token file into the download job); never in the app.
      - "${VLM_RUNNER_SECRETS}:${VLM_RUNNER_SECRETS}"
      - "egress-control:/run/vlm-egress"
    mem_limit: 512m

  # The download job's only way out (security download-egress §1): CONNECT :443 to huggingface.co / hf.co only,
  # public addresses only, per-job credential + byte budget. The only container on both networks.
  egress-proxy:
    <<: *hardening
    image: ntc-training-runner:local  # same reviewed code base, no new image
    command: ["python", "-m", "vlm_pipeline.runner.egress_proxy"]
    user: "${VLM_UID}:${VLM_GID}"
    environment:
      VLM_EGRESS_CONTROL: /run/vlm-egress/control.sock
      VLM_RUNNER_UID: "${VLM_UID}"  # only the runner may register budgets (SO_PEERCRED)
    volumes:
      - "egress-control:/run/vlm-egress"
    networks: [egress, default]
    depends_on: [runner]
    mem_limit: 128m

networks:
  egress:
    internal: true  # no route out: download jobs reach the internet only through egress-proxy

volumes:
  runner-sock: {}
  runner-state: {}
  egress-control: {}
