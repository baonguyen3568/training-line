  dpo-qwen35:
    summary: 'Teaches Qwen3.5 to prefer the better answer from chosen/rejected pairs.'
  distill-synthetic-qwen35:
    summary: 'A large model writes questions and answers for images; a small Qwen3.5 learns from them.'
  vision-unfrozen-qwen35-2b:
    summary: 'Trains Qwen3.5-2B''s vision part too, at a low learning rate, on high-res images.'
  two-stage-qwen35-2b:
    summary: 'Trains Qwen3.5-2B''s image–text connector first, then teaches answers with LoRA.'
    stage1: Train the connector
    stage2: Connector + LoRA
  qlora-4bit-qwen35-2b:
    summary: QLoRA on Qwen3.5-2B, holding the language part in 4-bit to save memory.
  invoice-to-json:
    summary: 'Retrains Nemotron Parse''s connector and language part to read CORD-v2 receipts into JSON.'
  invoice-qwen35-2b-lora:
    summary: LoRA-tune Qwen3.5-2B to read receipts into JSON, scored like the receipt template.
  image-video-understanding:
    summary: 'LoRA-tunes Qwen3.5-2B, measured on CORD-v2 receipts; swap the data to teach other tasks.'
  quantize-fp8-benchmark:
    summary: 'Quantizes Qwen3.5-2B to FP8, then re-scores it under the same conditions as the original.'
  grpo-geometry:
    summary: 'Qwen3.5 solves geometry problems and learns from rewards the app scores itself.'
