node:
  model.hf_pick:
    title: Choose base model
    desc: Pick a ready-made model to start from. The list is license-checked.
    param:
      model:
        label: Base model
        help: Smaller models run faster; larger ones answer better but need more memory.
    port:
      model: Model
  data.hf_load:
    title: Hugging Face dataset
    desc: Use a dataset published on Hugging Face.
    port:
      dataset: Data
    param:
      repo:
        label: Dataset
        help: A dataset on Hugging Face that has been license-checked.
      max_samples:
        label: Sample limit
        help: Use fewer samples for a quick test; choose "All" for the real run.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
  data.local_folder:
    title: Image folder + Q&A
    desc: Use your own images and questions/answers from the project folder.
    param:
      path:
        label: Data folder
        help: A folder in the project with images and a Q&A file.
      max_samples:
        label: Sample limit
        help: Use fewer samples for a quick test; choose "All" for the real run.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
      max_image_side_px:
        label: Max image side (px)
        help: Larger images are skipped to avoid using too much RAM (512–8192).
    port:
      dataset: Data
  data.format_vlm_chat:
    title: Format data as chat
    desc: Arrange images and Q&A into the format the model learns from.
  data.split:
    title: Split train / validation
    desc: Keep part of the data aside to check the model after training.
    param:
      val_fraction:
        label: Share kept for checking
        help: Share of data kept aside to check the model, not used for learning. Usually 10%.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
    port:
      dataset: Data
      train: Training data
      val: Validation data
  data.preview:
    title: Preview data
    desc: Look at a few samples and common problems before training.
  train.lora_vlm:
    title: Light fine-tune (LoRA)
    desc: Teach the model to answer like your data, using little memory.
    param:
      epochs:
        label: Training length
        help: How many passes over all the data. More passes take longer and can cause memorizing.
      lr_preset:
        label: Learning speed
        help: Slow is safer; fast learns quicker but can break the model. "Medium" is recommended.
      global_batch_size:
        label: Global batch size
        help: Samples combined per model update (4–64).
      local_batch_size:
        label: Local batch size
        help: Samples processed at once (1–4). Higher uses more RAM; 1 is safe on a shared machine.
      weight_decay:
        label: Weight decay
        help: Regularization against overfitting (0–0.1).
      activation_checkpointing:
        label: Memory saving (activation checkpointing)
        help: Slightly slower but uses much less RAM. Keep it on.
      max_recent_checkpoints:
        label: Checkpoints to keep
        help: How many recent saves to keep (1–5). More uses more disk.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
      lora_dim:
        label: LoRA rank (dim)
        help: Larger can learn more but uses more RAM (4–64).
      lora_alpha:
        label: LoRA alpha
        help: Strength of the add-on (8–128). Keep the default.
    port:
      base_model: Base model
      train_data: Training data
      val_data: Validation data (optional)
      adapter: Add-on (LoRA)
  train.sft_vlm:
    title: Full fine-tune
    desc: Teach the model to answer like your data by updating the parts of the model that need to learn.
    port:
      base_model: Base model
      train_data: Training data
      val_data: Validation data (optional)
      model: Complete model
    param:
      epochs:
        label: Training length
        help: How many passes over all the data. More passes take longer and can cause memorizing.
      lr_preset:
        label: Learning speed
        help: Slow is safer; fast learns quicker but can break the model. "Medium" is recommended.
      global_batch_size:
        label: Global batch size
        help: Samples combined per model update (4–64).
      local_batch_size:
        label: Local batch size
        help: Samples processed at once (1–4). Higher uses more RAM; 1 is safe on a shared machine.
      weight_decay:
        label: Weight decay
        help: Regularization against overfitting (0–0.1).
      activation_checkpointing:
        label: Memory saving (activation checkpointing)
        help: Slightly slower but uses much less RAM. Keep it on.
      max_recent_checkpoints:
        label: Checkpoints to keep
        help: How many recent saves to keep (1–5). More uses more disk.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
      freeze_vision_tower:
        label: Keep the vision part frozen
        help: 'Don''t retrain the model''s image reader: faster, less RAM, and less risk of harming its vision.'
  train.grpo_vlm:
    title: Learn from feedback (GRPO)
    desc: Improve the model by scoring its answers. For advanced users.
  serve.vllm:
    title: Start model for testing
    desc: Run the model as a service to chat with it or measure speed.
    port:
      model: Model
      endpoint: Model being served
    param:
      image:
        label: Image to try
        help: Upload a JPG, PNG or WEBP image (up to 20 MB). It stays on this machine, in the project folder.
      prompt:
        label: Question
        help: What you want to ask about the image, for example "What is the total?". The invoice-reading model (Nemotron Parse) always does the same task, so it ignores this box.
      answer_length:
        label: Answer length
        help: How long an answer can be at most.
      engine:
        label: Engine
        help: vLLM is faster; HF is used when a model doesn't support vLLM.
      temperature:
        label: Temperature
        help: 0 = always the same answer; higher = more varied (0–1.5).
      top_p:
        label: Top-p
        help: Limits word choices when generating (0.1–1). Keep 1.
      gpu_memory_utilization:
        label: Serving memory share
        help: Share of machine memory reserved for the cache (0.2–0.5). Above 0.3 only when the machine is free.
      max_model_len:
        label: Max context length (tokens)
        help: Longest question + answer (2048–32768). Longer uses more RAM.
  playground.chat:
    title: Chat with the model
    desc: Send images/videos and questions to see how the model answers.
  quantize.modelopt_ptq:
    title: Compress model
    desc: Make the model smaller and faster; quality may drop slightly.
    param:
      format:
        label: Compression type
        help: FP8 keeps quality best; NVFP4 balances; INT4-AWQ is smallest but may lose more quality.
      calib_size:
        label: Calibration images
        help: Images measured before compressing. More is more accurate but slower.
      quantize_vision:
        label: Also compress the vision part
        help: Usually kept off so image reading isn't degraded.
      kv_cache_quant:
        label: KV cache compression
        help: Saves RAM when serving long text; may slightly reduce quality.
    port:
      model: Model
      quantized: Compressed model
      calib_data: Calibration data
  eval.benchmarks:
    title: Run benchmarks
    desc: Score the model on standard test sets, grouped by skill.
    param:
      suite:
        label: Evaluate on
        help: Choose the test set. "Automatic" picks one for your template.
      level:
        label: Depth
        help: Quick for a first look; Full for the most reliable result but slow.
      compare_with:
        label: Compare with
        help: Show scores next to another model to see if it got better or worse.
      max_new_tokens:
        label: Max answer length (tokens)
        help: Answers are cut at this length (64–16384).
      thinking:
        label: Let the model think first
        help: 'The model reasons before answering: may be more accurate but slower.'
    port:
      model: Model
      report: Benchmark scores
      data: Test data (optional)
  bench.perf:
    title: Measure speed & memory
    desc: Measure how fast the model answers and how much memory it uses.
    port:
      model: Model
      report: Speed & memory
    param:
      scenario:
        label: Scenario
        help: 'Single user: how fast each answer is. Multiple users: 4 people asking at once.'
      compare_with:
        label: Compare with
        help: Show measurements next to another model.
      num_requests:
        label: Requests to measure
        help: More gives steadier numbers (10–500).
      output_tokens:
        label: Answer length for measuring (tokens)
        help: Fixed answer length for a fair comparison (64–2048).
      gpu_memory_utilization:
        label: Serving memory share
        help: Same as in the Try step (0.2–0.5).
  export.hf_dir:
    title: Save model
    desc: Save the model in Hugging Face format to use elsewhere.
    port:
      model: Model
      artifact: Exported model
    param:
      dest:
        label: Save to
        help: A folder in the project. The export includes the required license and credit text.
  train.merge_lora:
    title: Merge add-on into model
    desc: Combine the LoRA add-on with the base model into one complete model.
    port:
      base_model: Base model
      adapter: Add-on (LoRA)
      model: Complete model
  export.trtllm:
    title: Export for fast serving (TensorRT-LLM)
    desc: Prepare the model to serve as fast as possible on NVIDIA GPUs.
  compare.reports:
    title: Compare results
    desc: Put models' scores side by side to see which is better.
  note:
    title: Note
    desc: A note for people reading the workflow; it doesn't run anything.
template:
  lora_finetune:
