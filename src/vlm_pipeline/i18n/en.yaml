# UI copy — single source of truth for all user-visible text (ADR-009, P010, 007 R9). Owner: bao-design.
# Nested YAML. Lookup: node type ids containing dots are ONE key under `node` (e.g. node["train.lora_vlm"].title).
# Variants: key children (e.g. error.CFG-009.what.migratable). Placeholders {name}: sizes *_gb, counts *_count;
# vi.yaml and en.yaml must have identical keys and placeholders (tested). Missing key at runtime → show the key.
# locale: en
storage:
  group:
    downloaded_model: Downloaded models
    trained_model: Your trained models
    dataset: Datasets
    temp_result: Temporary results (can be regenerated)
  lock_reason:
    IN_USE_BY_RUNNING_WORKFLOW: Workflow "{workflow}" is running and needs this. Delete it after it finishes.
    PINNED_OR_KEEP: Pinned to keep. Unpin it if you want to delete it.
    REQUIRED_PARENT_AT_LOAD: The add-on (LoRA) "{child}" still needs this model to run. Delete the add-on first.
    SECURITY_PROTECTED: Protected by the project's safety rules. Contact an admin if it must be removed.
    RUN_NOT_FINISHED: Run "{run}" is unfinished or paused — it needs this to continue.
    WHITELIST: Run history (logs, metrics) is always kept.
  consequence:
    WILL_REDOWNLOAD:
      default: Workflow "{workflow}" will need to download {gb} GB again next time.
      no_workflow: You will need to download {gb} GB again if you use it later.
    WILL_RECOMPUTE: Can be regenerated in about {minutes} minutes.
    PERMANENT_LOSS: '"{name}" will be lost permanently — it cannot be restored or recreated exactly.'
    RESUME_IMPOSSIBLE: The model still works, but run "{run}" can no longer continue training from this point.
  dialog:
    title: Delete {item_count} items and free {gb} GB?
    typed_confirm: Type  {confirm_text}  to confirm
    typed_reason_permanent: This item cannot be recreated.
    typed_reason_redownload: '{gb} GB would have to be downloaded again.'
    cancel: Cancel
    confirm: Delete permanently
    plan_expired: This list is out of date (over 10 minutes). Checking again…
    approval_needed: This deletes more than {threshold_gb} GB, so an admin must approve it first.
  event_done: Deleted at {time} by {who}
  preflight_hint:
    free_temp: Free {gb} GB from temporary results
  item:
    temp_result_of_run: Temporary results of run {run_name}
error:
  GPU-001:
    title: Software doesn't match this GPU
    what: A component was built for a different CUDA version than this machine supports.
  GPU-002:
    title: Fast mode failed to start
    what: The speed-up component doesn't support the GB10 chip yet; turning it off lets the step run, just slower.
  CACHE-001:
    title: Saved result is damaged, re-running
    what: The saved result of "{node}" (from {saved_at}) can't be read, so the app will run this step again, about {est_minutes} minutes.
  SYS-003:
    title: This step stopped unexpectedly
    what: This step stopped midway without reporting why (the machine may have restarted or the process was killed). Progress up to {checkpoint_step} was saved if available.
  DISK-002:
    title: Approval needed before freeing space
    what: You're about to delete {gb} GB ({item_count} items), above this shared machine's {threshold_gb} GB limit, so an admin must approve it with a command. Nothing has been deleted yet.
  CFG-008:
    title: Two steps share the same ID
    what: '{duplicate_count} steps share the ID "{node_id}", so the app can''t tell which one the wires belong to. This usually comes from editing the workflow file by hand.'
  CFG-004:
    title: Workflow uses a step the app lacks
    what:
      not_installed_trusted: '"{node_type}" is a third-party node not installed on this machine. It is in the app''s trusted sources; review it and decide whether to install.'
      not_installed_unknown: '"{node_type}" is a third-party node not in trusted sources — this workflow was shared by someone else. The app won''t install from details in the file.'
      not_allowed: '"{node_type}" is not allowed on this machine.'
  CFG-009:
    title: Workflow made with another step version
    what:
      migratable: '"{node_id}" was made with {node_type} {workflow_version}; this machine has {installed_version}. The app can move the settings to the new version; review the changes first.'
      not_migratable: '"{node_id}" was made with {node_type} {workflow_version}; this machine has {installed_version} and it can''t be converted automatically. Open the step to adjust its settings.'
  MEM-001:
    title: Not enough memory for this step
    what: This step needs about {need_gb} GB but only {avail_gb} GB is free, because the machine is shared with other apps.
  MEM-002:
    title: Paused to protect the machine
    what: Free memory dropped below the safe level, so the app saved progress and paused to avoid freezing the machine.
  MEM-003:
    title: Ran out of memory while running
    what: The model used more memory than expected midway, usually because of large images or long text.
    why: Images of {image_size_px}px with batch size {batch_size} need more memory than the machine has free.
  MEM-004:
    title: Model server reserves too much memory
    what: The serving setting reserves too much memory for its cache, which can affect other apps.
  DISK-001:
    title: Not enough disk space
    what: About {need_gb} GB is needed to save the model and results, but only {avail_gb} GB is left.
  SYS-001:
    title: The GPU isn't available right now
    what:
      busy: Only one heavy job can run at a time; {who} has been running "{job}" since {since}.
      stale: '{who}''s lock for "{job}" is still there but the process has stopped. The app won''t remove the lock itself; an admin needs to check it.'
      corrupt: The machine's lock file can't be read, so the app treats the machine as busy for now. Please tell an admin.
  SYS-002:
    title: Waited too long for the machine
    what: The workflow has waited {minutes} minutes but the machine is still busy.
  GPU-003:
    title: This compression is slow here
    what: On this machine NVFP4 may run slower than FP8 with similar quality.
  DATA-001:
    title: Image count in data doesn't match
    what: 'Sample #{idx} has {image_count} images but the text has only {slot_count} image slots, or was cut off for being too long.'
  DATA-002:
    title: Some images are broken or unusual
    what: '{image_count} images can''t be opened or have an unusual format (CMYK, RGBA, too small).'
  DATA-003:
    title: The model doesn't seem to learn
    what: The loss is near zero from the start, usually because the data marks the wrong part to learn.
  DATA-004:
    title: Images missing from data
    what: '{sample_count} samples point to images that don''t exist.'
  MODEL-001:
    title: Can't read the converted model
    what: Parts of the model file don't match the expected format, usually due to a library version difference.
  MODEL-002:
    title: Converted model gives wrong answers
    what: The automatic check found the new model answers very differently from the original.
  NET-001:
    title: Couldn't download model or data
    what: Couldn't reach Hugging Face/NGC, or you're not signed in.
  CFG-001:
    title: These two steps can't connect
    what: '"{a}" outputs {type_a} but "{b}" needs {type_b}.'
  CFG-002:
    title: Steps are connected in a loop
    what: 'The wires form a loop: {nodes}. Each step must run after the previous one and can''t go back.'
  CFG-003:
    title: This step is missing an input
    what: '"{node}" needs "{port}" but nothing is connected.'
  CFG-005:
    title: A setting is not valid
    what: '"{param}" of "{node}" is {value}, but it must {rule}.'
  CFG-006:
    title: A wire points to a missing step
    what: A wire points to "{node_id}", but that step was deleted or renamed.
  CFG-007:
    title: Can't open the workflow file
    what: The file isn't a valid workflow or contains unexpected data ({field}).
  SEC-001:
    title: Path is outside the workspace
    what: '"{path}" is outside the project folder, so the app can''t read or write there.'
  SEC-002:
    title: Workflow contains a password or token
    what: Setting "{param}" seems to contain a token. Store tokens in Settings; the workflow should only refer to them.
  SEC-003:
    title: License doesn't allow this use
    what: The license of {name} doesn't allow {use}.
  SYS-000:
    title: An unrecognized error occurred
    what: The app doesn't recognize this error. Progress was saved if possible; you can send a report so the team can fix it.
  SYS-004:
    title: 'App error: GPU step without the lock'
    what: This is an app error, not something you did. The step was stopped before using the GPU, so the machine and other jobs weren't affected.
