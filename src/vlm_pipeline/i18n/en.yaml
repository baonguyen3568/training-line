node:
  model.hf_pick:
    title: Choose base model
    desc: Pick a ready-made model to start from. The list is license-checked.
    param:
      model:
        label: Base model
        help: Smaller models run faster; larger ones answer better but need more memory.
      user_model:
        label: A model you added
        help: A model you added from Hugging Face (not verified by the team). When set, it replaces the base model above.
      user_repo:
        label: Repository of the added model
        help: The Hugging Face repository of the model you added. Filled in by the app.
      user_revision:
        label: Revision of the added model
        help: The commit of the model you added. Filled in by the app so anyone who opens the workflow uses this exact one.
    port:
      model: Model
  data.hf_load:
    title: Hugging Face dataset
    desc: Use a dataset published on Hugging Face.
    port:
      dataset: Data
    param:
      repo:
        label: Dataset
        help: A dataset on Hugging Face that has been license-checked.
      user_dataset:
        label: Dataset you added
        help: A dataset you added from Hugging Face yourself (not vetted by the team), converted to images + answers. When chosen it replaces the dataset above.
      user_repo:
        label: Repository of the added dataset
        help: The Hugging Face repository of the dataset you added. Filled in by the app.
      user_revision:
        label: Version of the added dataset
        help: The version (commit) of the dataset you added. Filled in by the app so everyone opening the workflow uses exactly this one.
      max_samples:
        label: Sample limit
        help: Use fewer samples for a quick test; choose "All" for the real run.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
  data.local_folder:
    title: Image folder + Q&A
    desc: Use your own images and questions/answers from the project folder.
    param:
      path:
        label: Data folder
        help: A folder in the project with images and a Q&A file.
      max_samples:
        label: Sample limit
        help: Use fewer samples for a quick test; choose "All" for the real run.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
      max_image_side_px:
        label: Max image side (px)
        help: Larger images are skipped to avoid using too much RAM (512–8192).
      input_format:
        label: Label file format
        help: Keep "Detect automatically" if unsure. The app reads LLaVA, ShareGPT or HF chat labels and converts them for training.
    port:
      dataset: Data
  data.format_vlm_chat:
    title: Format data as chat
    desc: Arrange images and Q&A into the format the model learns from.
  data.split:
    title: Split train / validation
    desc: Keep part of the data aside to check the model after training.
    param:
      val_fraction:
        label: Share kept for checking
        help: Share of data kept aside to check the model, not used for learning. Usually 10%.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
    port:
      dataset: Data
      train: Training data
      val: Validation data
  data.filter:
    title: Filter data
    desc: Drop samples whose image is too small or broken, or whose answer is too long, before training.
    param:
      min_short_side_px:
        label: Minimum short side (px)
        help: Images with a shorter side below this are dropped; they are too small for the model to read text.
      max_target_chars:
        label: Maximum answer length (characters)
        help: Samples with a longer answer are dropped; they would be cut off during training.
      drop_broken:
        label: Drop broken images
        help: Skip images that cannot be opened instead of failing halfway.
      max_long_side_px:
        label: Maximum long side (px)
        help: Images with a longer side above this are dropped to save memory.
      max_megapixels:
        label: Maximum image size (megapixels)
        help: Images larger than this are dropped to save RAM (at most 40).
      min_target_chars:
        label: Minimum answer length (characters)
        help: Samples with a shorter answer (for example an empty one) are dropped.
    port:
      dataset: Data
  data.dedupe:
    title: Remove duplicates
    desc: Drop duplicate samples, and training samples whose image is also in the test data, so scores stay honest.
    param:
      compare:
        label: How to compare
        help: '"Identical" drops byte-identical images only; "Near-identical" also drops resized or re-compressed copies.'
      check_leak:
        label: Drop samples that match the test data
        help: If a training image is also in the test data (the "Test data" port), the model is scored on images it has already learned and the score looks better than it is. Keep it on.
      dhash_max_distance:
        label: Maximum difference for near-identical
        help: Only with "Near-identical". Higher means more images count as duplicates (0–16).
    port:
      dataset: Data
      heldout: Test data
  data.caption_vlm:
    title: Caption images with a model
    desc: A vision model writes the answer for samples that have none, to use as training data. Check a few answers before training; the model can get things wrong.
    param:
      task:
        label: What the model writes
        help: '"Describe" writes a description. "Question + answer" lets a large model ask one question about the image and answer it, as data to teach a small model.'
      qa_focus:
        label: Kind of question
        help: What the model asks about in the image. Each kind uses one of the app's fixed question templates.
      prompt:
        label: Question for the model
        help: The request sent with every image, for example "Describe this image in detail".
      max_new_tokens:
        label: Maximum length (tokens)
        help: Caps each answer (32–1024). Longer takes more time.
      overwrite_existing:
        label: Overwrite existing answers
        help: On rewrites samples that already have an answer, replacing it. Off writes only for samples without one.
    port:
      dataset: Data
      model: Captioning model
  data.mix:
    title: Mix data
    desc: Combine 2 to 4 datasets into one for training.
    param:
      strategy:
        label: How to mix
        help: '"One after another" keeps every sample; "Interleave" samples by the shares you set.'
      weight_1:
        label: Share of set 1
        help: Interleave only. Relative to the other sets.
      weight_2:
        label: Share of set 2
        help: Interleave only. Relative to the other sets.
      weight_3:
        label: Share of set 3
        help: Interleave only, when set 3 is wired.
      weight_4:
        label: Share of set 4
        help: Interleave only, when set 4 is wired.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
    port:
      dataset_1: Dataset 1
      dataset_2: Dataset 2
      dataset_3: Dataset 3
      dataset_4: Dataset 4
      dataset: Mixed data
  quantize.qat:
    title: Quantization-aware training (QAT)
    desc: Quantizes the model, then trains it briefly with simulated quantization to win back the score lost.
    param:
      format:
        label: Quantization format
        help: The number format the model uses after quantization.
      adapter:
        label: How to retrain
        help: '"Light (LoRA)" trains a small add-on and needs less memory. "Full" trains every weight, only for small models.'
      epochs:
        label: Retraining length
        help: How many times the model goes through the data. Retraining after quantization usually needs little.
      lr_preset:
        label: Learning speed
        help: Retraining after quantization uses a low speed so the model is not damaged. Keep "Low".
      max_steps:
        label: Maximum steps
        help: Stops after this many steps even before the passes end (0 = by passes).
      calib_size:
        label: Calibration images
        help: How many images measure the value ranges before quantization.
    port:
      model: Model
      train_data: Retraining data
      calib_data: Calibration data (optional)
      quantized: Quantized model
  train.dpo_vlm:
    title: Learn from good/bad pairs (DPO)
    desc: Teaches the model to prefer the better answer, from "chosen / rejected" pairs in your data.
    param:
      beta:
        label: Stay close to the base model (beta)
        help: Higher keeps the model closer to the base model (0.01–1). Keep the default.
      epochs:
        label: Training length
        help: How many times the model goes through the data.
      lr_preset:
        label: Learning speed
        help: How fast the model changes with the answer pairs. Keep "Medium".
      sft_weight:
        label: Also learn the chosen answer
        help: Besides comparing pairs, the model learns the chosen answer directly with this weight (0 = compare only).
      lora_dim:
        label: LoRA rank (dim)
        help: Bigger learns more but needs more RAM (4–64). Keep the default.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
    port:
      base_model: Base model
      train_data: Answer-pair data
      val_data: Validation data (optional)
      adapter: Add-on (LoRA)
  data.preview:
    title: Preview data
    desc: Look at a few samples and common problems before training.
  train.lora_vlm:
    title: Light fine-tune (LoRA)
    desc: Teach the model to answer like your data, using little memory.
    param:
      epochs:
        label: Training length
        help: How many passes over all the data. More passes take longer and can cause memorizing.
      lr_preset:
        label: Learning speed
        help: Slow is safer; fast learns quicker but can break the model. "Medium" is recommended.
      global_batch_size:
        label: Global batch size
        help: Samples combined per model update (4–64).
      local_batch_size:
        label: Local batch size
        help: Samples processed at once (1–4). Higher uses more RAM; 1 is safe on a shared machine.
      weight_decay:
        label: Weight decay
        help: Regularization against overfitting (0–0.1).
      activation_checkpointing:
        label: Memory saving (activation checkpointing)
        help: Slightly slower but uses much less RAM. Keep it on.
      max_recent_checkpoints:
        label: Checkpoints to keep
        help: How many recent saves to keep (1–5). More uses more disk.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
      lora_dim:
        label: LoRA rank (dim)
        help: Larger can learn more but uses more RAM (4–64).
      lora_alpha:
        label: LoRA alpha
        help: Strength of the add-on (8–128). Keep the default.
      quantize_base:
        label: Compress the base model while training (QLoRA)
        help: Loads the base model in 4-bit to save memory while training. Pays off most for large models (~9B and up), with quality close to plain training. Only for models set up for QLoRA (currently the Qwen3.5 models).
      advanced:
        label: Advanced engine options
        help: Options of the training engine (NeMo AutoModel), under their original names. Change them only if you know what they do; empty uses the tested defaults. The app still checks the values before running.
    port:
      base_model: Base model
      train_data: Training data
      val_data: Validation data (optional)
      adapter: Add-on (LoRA)
  train.sft_vlm:
    title: Full fine-tune
    desc: Teach the model to answer like your data by updating the parts of the model that need to learn.
    port:
      base_model: Base model
      train_data: Training data
      val_data: Validation data (optional)
      model: Complete model
    param:
      advanced:
        label: Advanced engine options
        help: Options of the training engine (NeMo AutoModel), under their original names. Change them only if you know what they do; empty uses the tested defaults. The app still checks the values before running.
      epochs:
        label: Training length
        help: How many passes over all the data. More passes take longer and can cause memorizing.
      lr_preset:
        label: Learning speed
        help: Slow is safer; fast learns quicker but can break the model. "Medium" is recommended.
      global_batch_size:
        label: Global batch size
        help: Samples combined per model update (4–64).
      local_batch_size:
        label: Local batch size
        help: Samples processed at once (1–4). Higher uses more RAM; 1 is safe on a shared machine.
      weight_decay:
        label: Weight decay
        help: Regularization against overfitting (0–0.1).
      activation_checkpointing:
        label: Memory saving (activation checkpointing)
        help: Slightly slower but uses much less RAM. Keep it on.
      max_recent_checkpoints:
        label: Checkpoints to keep
        help: How many recent saves to keep (1–5). More uses more disk.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
      train_blocks:
        label: What is trained
        help: 'Which parts of the model learn again; the rest stays as it is. By default only the language part: faster, less RAM, and less risk of harming its vision.'
      vision_lr_scale:
        label: Learning speed of the vision part
        help: When the vision part is trained too, its learning speed is this number times the rest's (0.05–0.2, i.e. 5–20 times slower), so its vision is not harmed.
  train.grpo_vlm:
    title: Learn from feedback (GRPO)
    desc: Improve the model by scoring its answers. For advanced users.
    param:
      reward:
        label: How answers are scored
        help: How the engine scores the answer against the one in your data. "Same value" counts 0.5 and 1/2 as equal. No code needed.
      epochs:
        label: Training length
        help: How many times the model goes through the data.
      lr_preset:
        label: Learning speed
        help: How fast the model changes with the rewards. Keep "Medium".
      num_generations:
        label: Answers per question
        help: How many answers the model writes to compare (2–8). More learns better but is slower and needs more memory.
      max_new_tokens:
        label: Maximum answer length (tokens)
        help: Caps each answer the model writes (32–1024).
      kl_coef:
        label: Stay close to the base model (KL)
        help: Higher keeps the model closer to the base model. Keep the default.
      lora_dim:
        label: LoRA rank (dim)
        help: Larger can learn more but uses more RAM (4–64). Keep the default.
      format_weight:
        label: Reward for the right format
        help: Reward when the answer has the expected shape (a number, a JSON object, or the pattern).
      correctness_weight:
        label: Reward for the right answer
        help: Reward when the answer matches the reference.
      seed:
        label: Random seed
        help: Keep it the same to get identical results when re-running.
    port:
      base_model: Base model
      train_data: Training data
      val_data: Validation data (optional)
      adapter: Add-on (LoRA)
  serve.vllm:
    title: Start model for testing
    desc: Run the model as a service to chat with it or measure speed.
    port:
      model: Model
      endpoint: Model being served
    param:
      image:
        label: Image to try
        help: Upload a JPG, PNG or WEBP image (up to 20 MB). It stays on this machine, in the project folder.
      prompt:
        label: Question
        help: What you want to ask about the image, for example "What is the total?". The invoice-reading model (Nemotron Parse) always does the same task, so it ignores this box.
      answer_length:
        label: Answer length
        help: How long an answer can be at most.
      engine:
        label: Engine
        help: vLLM is faster; HF is used when a model doesn't support vLLM.
      temperature:
        label: Temperature
        help: 0 = always the same answer; higher = more varied (0–1.5).
      top_p:
        label: Top-p
        help: Limits word choices when generating (0.1–1). Keep 1.
      gpu_memory_utilization:
        label: Serving memory share
        help: Share of machine memory reserved for the cache (0.2–0.5). Above 0.3 only when the machine is free.
      max_model_len:
        label: Max context length (tokens)
        help: Longest question + answer (2048–32768). Longer uses more RAM.
  playground.chat:
    title: Chat with the model
    desc: Send images/videos and questions to see how the model answers.
  quantize.modelopt_ptq:
    title: Compress model
    desc: Make the model smaller and faster; quality may drop slightly.
    param:
      format:
        label: Compression type
        help: FP8 keeps quality best; NVFP4 balances; INT4-AWQ is smallest but may lose more quality.
      calib_size:
        label: Calibration images
        help: Images measured before compressing. More is more accurate but slower.
      quantize_vision:
        label: Also compress the vision part
        help: Usually kept off so image reading isn't degraded.
      kv_cache_quant:
        label: KV cache compression
        help: Saves RAM when serving long text; may slightly reduce quality.
    port:
      model: Model
      quantized: Compressed model
      calib_data: Calibration data
  eval.benchmarks:
    title: Run benchmarks
    desc: Score the model on standard test sets, grouped by skill.
    param:
      suite:
        label: Evaluate on
        help: Choose the test set. "Automatic" picks one for your template.
      level:
        label: Depth
        help: Quick for a first look; Full for the most reliable result but slow.
      compare_with:
        label: Compare with
        help: Show scores next to another model to see if it got better or worse.
      max_new_tokens:
        label: Max answer length (tokens)
        help: Answers are cut at this length (64–16384).
      thinking:
        label: Let the model think first
        help: 'The model reasons before answering: may be more accurate but slower.'
    port:
      model: Model
      report: Benchmark scores
      data: Test data (optional)
  bench.perf:
    title: Measure speed & memory
    desc: Measure how fast the model answers and how much memory it uses.
    port:
      model: Model
      report: Speed & memory
    param:
      scenario:
        label: Scenario
        help: 'Single user: how fast each answer is. Multiple users: 4 people asking at once.'
      compare_with:
        label: Compare with
        help: Show measurements next to another model.
      num_requests:
        label: Requests to measure
        help: More gives steadier numbers (10–500).
      output_tokens:
        label: Answer length for measuring (tokens)
        help: Fixed answer length for a fair comparison (64–2048).
      gpu_memory_utilization:
        label: Serving memory share
        help: Same as in the Try step (0.2–0.5).
  export.hf_dir:
    title: Save model
    desc: Save the model in Hugging Face format to use elsewhere.
    port:
      model: Model
      artifact: Exported model
    param:
      dest:
        label: Save to
        help: A folder in the project. The export includes the required license and credit text.
  train.merge_lora:
    title: Merge add-on into model
    desc: Combine the LoRA add-on with the base model into one complete model.
    port:
      base_model: Base model
      adapter: Add-on (LoRA)
      model: Complete model
  export.trtllm:
    title: Export for fast serving (TensorRT-LLM)
    desc: Prepare the model to serve as fast as possible on NVIDIA GPUs.
  compare.reports:
    title: Compare results
    desc: Put models' scores side by side to see which is better.
  note:
    title: Note
    desc: A note for people reading the workflow; it doesn't run anything.
template:
  lora_finetune:
    title: Teach the model your documents (LoRA)
    desc: Lightly fine-tune a vision-language model on your images and Q&A. Try it right away with the sample invoice data.
  quantize_bench:
    title: Compress a model & re-check scores
    desc: Make the model smaller so it uses less memory, then score it under the same conditions as the original to see how much quality changes.
  invoice_to_json:
    title: Read receipts → JSON
    desc: Teach a model to read receipt photos and return fields (store, items, total…) as JSON. Runs right away on the CORD-v2 sample data, no account needed.
    built_on: Uses NVIDIA Nemotron-Parse v1.1 · CORD-v2 data
  image_video_understanding:
    title: Understand images
    desc: Teach a model to answer questions about images from your data. Uses Qwen3.5-2B with lightweight LoRA training; no account needed.
    needs_account: Needs a Hugging Face account
