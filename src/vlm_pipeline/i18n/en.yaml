method:
  full_sft:
    title: Full fine-tune (SFT)
    when: When you have plenty of data and need the biggest change in how the model answers; uses the most memory.
  lora:
    title: Light fine-tune (LoRA)
    when: 'The default choice: quick to train, little memory, and the base model stays unchanged.'
  qlora:
    title: 4-bit light fine-tune (QLoRA)
    when: When the model is bigger than the free memory; keeps the base model in 4-bit and trains LoRA.
  two_stage:
    title: Two-stage training (LLaVA-style)
    when: When the image type is very new to the model and you have many image–caption pairs; train the connector first, then the answers.
  vision_unfrozen:
    title: Unfrozen vision part, high-res images
    when: When your images look very different from usual ones; trains the vision part too at a low learning rate, using more memory.
  distill:
    title: Distill from a larger model
    when: When you have few reference answers; a large model writes them and a small model learns from them.
    note: Check that the large model's license allows using its answers to train another model.
  dpo:
    title: Learn from good/bad pairs (DPO)
    when: When you have good and bad answers for the same image; teaches the model to prefer the better one and invent fewer details.
  grpo:
    title: Learn from feedback (GRPO)
    when: When answers can be scored automatically (numbers, JSON); the model tries several and learns from the scores. Slowest method.
  ptq:
    title: Post-training quantization (PTQ)
    when: When you need a smaller model to run; quantize, then re-score, with no extra training.
  qat:
    title: Quantization-aware training (QAT)
    when: When quantization costs too much score; a short training run with simulated quantization wins it back.
