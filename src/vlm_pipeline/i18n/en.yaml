# UI copy — single source of truth for all user-visible text (ADR-009, P010, 007 R9). Owner: bao-design.
# Nested YAML. Lookup: node type ids containing dots are ONE key under `node` (e.g. node["train.lora_vlm"].title).
# Variants: key children (e.g. error.CFG-009.what.migratable). Placeholders {name}: sizes *_gb, counts *_count;
# vi.yaml and en.yaml must have identical keys and placeholders (tested). Missing key at runtime → show the key.
# locale: en
storage:
  group:
    downloaded_model: Downloaded models
    trained_model: Your trained models
    dataset: Datasets
    temp_result: Temporary results (can be regenerated)
  lock_reason:
    IN_USE_BY_RUNNING_WORKFLOW: Workflow "{workflow}" is running and needs this. Delete it after it finishes.
    PINNED_OR_KEEP: Pinned to keep. Unpin it if you want to delete it.
    REQUIRED_PARENT_AT_LOAD: The add-on (LoRA) "{child}" still needs this model to run. Delete the add-on first.
    SECURITY_PROTECTED: Protected by the project's safety rules. Contact an admin if it must be removed.
    RUN_NOT_FINISHED: Run "{run}" is unfinished or paused — it needs this to continue.
    WHITELIST: Run history (logs, metrics) is always kept.
    GPU_LOCK_HOLDER: This run is using the GPU (or the app can't read the GPU status yet), so it can't be deleted now. Try again after the run finishes.
    UNKNOWN_STATUS: The status of run "{run}" cannot be read, so the app keeps it to be safe.
    RUN_INTERRUPTED: Run "{run}" was interrupted. Its checkpoints are kept until {until} so you can resume it; after that only the last one is kept.
    INPUT_OF_RUNNING_ATTEMPT: A newer run of step "{node}" resumes from these checkpoints. You can delete them once that run finishes or can no longer be resumed.
    GENERATION_UNREADABLE: The app cannot read the internal records of step "{node}", so it cannot reset it yet. This is not your fault; ask an admin to check outputs/system/node_generations.
    GENERATION_LIMIT: Step "{node}" has been reset too many times. Remove it and drag a new one in from the library.
  attention:
    RUN_INTERRUPTED_EXPIRING: Step "{node}" (run "{run}") was interrupted. Resume it before {until}; after that the app cleans up older checkpoints and keeps only the last one.
  consequence:
    WILL_REDOWNLOAD:
      default: Workflow "{workflow}" will need to download {gb} GB again next time.
      no_workflow: You will need to download {gb} GB again if you use it later.
    WILL_RECOMPUTE: Can be regenerated in about {minutes} minutes.
    PERMANENT_LOSS: '"{name}" will be lost permanently — it cannot be restored or recreated exactly.'
    RESUME_IMPOSSIBLE: The model still works, but run "{run}" can no longer continue training from this point.
  reset_step:
    menu: Reset step
    menu_hint: Delete every run of this step so it starts over.
    title: Reset this step?
    body: The app will delete {attempt_count} runs of step "{node}" and free {gb} GB. Next time, this step runs from the start.
    downstream: Later steps that use this step's results will run again too.
    lost_lead: "You will lose:"
    lost_checkpoints: This step's checkpoints
    lost_history: The logs and charts of these runs
    confirm: Reset step
    done: Step "{node}" was reset; {gb} GB freed.
    nothing: This step has not run yet; there is nothing to reset.
  dialog:
    title: Delete {item_count} items and free {gb} GB?
    typed_confirm: Type  {confirm_text}  to confirm
    typed_reason_permanent: This item cannot be recreated.
    typed_reason_redownload: '{gb} GB would have to be downloaded again.'
    cancel: Cancel
    confirm: Delete permanently
    plan_expired: This list is out of date (over 10 minutes). Checking again…
    approval_needed: This deletes more than {threshold_gb} GB, so an admin must approve it first.
  event_done: Deleted at {time} by {who}
  preflight_hint:
    free_temp: Free {gb} GB from temporary results
  item:
    temp_result_of_run: Temporary results of run {run_name}
    checkpoint_of_run: Checkpoint {checkpoint} of run {run_name}
    set_aside_of_run: Earlier training set aside in run {run_name}
  protected_reason:
    TRAINED_MODEL: A model you trained — the app won't delete it automatically. You can still delete it by typing its name to confirm.
    MANIFEST_UNREADABLE: This run's information is damaged, so the app won't delete it automatically. You can still delete it manually by typing its name.
  section:
    auto: The app cleans these up when needed
    manual: You decide
    kept: Kept
  panel:
    title: Storage
    refresh: Check again
    empty: Nothing to clean up.
    delete_selected: Delete {item_count} selected
    last_used: Last used {time}
    freed: Freed {gb} GB.
    skipped_title: "Could not delete {item_count}:"
    cleanup_in_progress: A cleanup is already running. Try again in a few minutes.
    admin_command: Command for an admin
    copy: Copy command
    copied: Copied
    kept_total: Keeping {gb} GB
  skip_reason:
    CONFIRM_REQUIRED: The name was not typed correctly.
    NOT_IN_PLAN: The list changed and this item is gone.
    NOT_APPLICABLE: This item cannot be deleted right now.
    NOT_EVICTABLE: This item is in use or already deleted.
    RUN_DIR_INVALID: This run's folder is missing or outside the project folder.
    DELETE_FAILED: Deleting failed. Try again; if it keeps failing, tell an admin.
    STATE_CHANGED: This item changed in the meantime. Press "Check again" and choose again.
error:
  GPU-001:
    title: Software doesn't match this GPU
    what: A component was built for a different CUDA version than this machine supports.
  GPU-002:
    title: Fast mode failed to start
    what: The speed-up component doesn't support the GB10 chip yet; turning it off lets the step run, just slower.
  CACHE-001:
    title: Saved result is damaged, re-running
    what: The saved result of "{node}" (from {saved_at}) can't be read, so the app will run this step again, about {est_minutes} minutes.
    what_no_estimate: The saved result of "{node}" (from {saved_at}) can't be read, so the app will run this step again.
  SYS-005:
    title: This step keeps failing; retries stopped
    what: "Step \"{node}\" failed all {attempt_count} times it ran, so the app stopped retrying it. Check the error from the last run (changing the step's settings lets it run again); if the cause is unclear, send a bug report."
    why: Failing this many times in a row usually points to a setup or machine problem, not a one-off glitch.
  QNT-001:
    title: The quantized model is broken
    what:
      top1: 'The model from step "{node}" matches the original on only {top1_pct}% of words across {sample_count} test images (minimum {limit_top1_pct}%). The app will not use it; remove the quantize step or send a bug report.'
      kl: 'The model from step "{node}" picks its words very differently from the original across {sample_count} test images. The app will not use it; remove the quantize step or send a bug report.'
  QNT-002:
    title: The quantized model differs noticeably
    what:
      top1: 'The model from step "{node}" matches the original on {top1_pct}% of words across {sample_count} test images, below the usual level ({limit_top1_pct}%). It is still usable; score it before real use.'
      kl: 'The model from step "{node}" picks its words more differently from the original than usual across {sample_count} test images. It is still usable; score it before real use.'
  SYS-003:
    title: This step stopped unexpectedly
    what: This step stopped midway without reporting why (the machine may have restarted or the process was killed). Progress up to {checkpoint_step} was saved if available.
  DISK-002:
    title: Approval needed before freeing space
    what: You're about to delete {gb} GB ({item_count} items), above this shared machine's {threshold_gb} GB limit, so an admin must approve it with a command. Nothing has been deleted yet.
  CFG-008:
    title: Two steps share the same ID
    what: '{duplicate_count} steps share the ID "{node_id}", so the app can''t tell which one the wires belong to. This usually comes from editing the workflow file by hand.'
  CFG-004:
    title: Workflow uses a step the app lacks
    what:
      not_installed_trusted: '"{node_type}" is a third-party node not installed on this machine. It is in the app''s trusted sources; review it and decide whether to install.'
      not_installed_unknown: '"{node_type}" is a third-party node not in trusted sources — this workflow was shared by someone else. The app won''t install from details in the file.'
      not_allowed: '"{node_type}" is not allowed on this machine.'
  CFG-009:
    title: Workflow made with another step version
    what:
      migratable: '"{node_id}" was made with {node_type} {workflow_version}; this machine has {installed_version}. The app can move the settings to the new version; review the changes first.'
      not_migratable: '"{node_id}" was made with {node_type} {workflow_version}; this machine has {installed_version} and it can''t be converted automatically. Open the step to adjust its settings.'
  CFG-010:
    title: This model doesn't support this training mode
    what:
      full_finetune_only: '"{node}" uses LoRA, but {model} only supports full fine-tuning. Nothing has run yet; switch to the full fine-tune step or pick another model.'
      lora_only: '"{node}" uses full fine-tuning, but {model} only supports LoRA. Nothing has run yet; switch to the LoRA step or pick another model.'
      not_trainable: '"{node}" is a training step, but {model} is for trying out and evaluation only and can''t be trained. Nothing has run yet; pick another model.'
  CFG-011:
    title: This step can't run for real yet
    what: '"{node}" isn''t supported for real runs in this version yet. Remove the step to run the rest, or wait for an update.'
  CFG-012:
    title: This step group has a problem
    what:
      invalid_definition: 'A step group in this workflow file is broken (missing parts or wrong format). Ask the sender for the file again; if the app created it, send a bug report.'
      namespace: 'Group "{group}" uses a name reserved for the app''s built-in groups. Your own groups must start with "user.".'
      name_clash: 'Two groups are named "{group}", or the name matches a built-in step. Rename one of them.'
      bad_mapping: 'Group "{group}" connects a port or setting to an inner step that does not have it. Fix the group, or ask the sender for the file again.'
      recursion: 'Group "{group}" contains itself. Remove "{group}" from inside itself.'
      too_deep: 'Group "{group}" is nested more than {limit} levels deep. Merge one level.'
      too_many_nodes: 'With every group expanded, the workflow has more than {limit} steps. Split it into smaller workflows.'
      too_many_edges: 'With every group expanded, the workflow has more than {limit} connections. Split it into smaller workflows.'
      too_many_definitions: 'The workflow file defines more than {limit} groups. Remove the unused ones.'
      id_too_long: 'The step names inside group "{group}" add up to a name that is too long. Use shorter step names.'
  EXP-001:
    title: License text missing for export
    what: The app has no approved license text for {license_ids} yet, so it can't export the model with its licenses. This isn't your fault; send a report so the team can add it.
  EXP-002:
    title: This model can't be exported yet
    what: Exporting {model} to a folder for use on another machine isn't supported yet (step "{node}"). You can still train, try out and evaluate it in the app.
  EXP-003:
    title: The export may contain a secret
    what: The export of "{node}" has a string that looks like an access key (token) in {files}, so the app stopped and has written nothing out. Remove the key from those files and export again; if unsure, send a report.
  MEM-001:
    title: Not enough memory for this step
    what: This step needs about {need_gb} GB but only {avail_gb} GB is free, because the machine is shared with other apps.
  MEM-002:
    title: Paused to protect the machine
    what: Free memory dropped below the safe level, so the app saved progress and paused to avoid freezing the machine.
  MEM-003:
    title: Ran out of memory while running
    what: The model used more memory than expected midway, usually because of large images or long text.
    why: Images of {image_size_px}px with batch size {batch_size} need more memory than the machine has free.
  MEM-004:
    title: Model server reserves too much memory
    what: The serving setting reserves too much memory for its cache, which can affect other apps.
  DISK-001:
    title: Not enough disk space
    what: About {need_gb} GB is needed to save the model and results, but only {avail_gb} GB is left.
  SYS-001:
    title: The GPU isn't available right now
    what:
      busy: Only one heavy job can run at a time; {who} has been running "{job}" since {since}.
      stale: '{who}''s lock for "{job}" is still there but the process has stopped. The app won''t remove the lock itself; an admin needs to check it.'
      corrupt: The machine's lock file can't be read, so the app treats the machine as busy for now. Please tell an admin.
  SYS-002:
    title: Waited too long for the machine
    what: The workflow has waited {minutes} minutes but the machine is still busy.
  GPU-003:
    title: This compression is slow here
    what: On this machine NVFP4 may run slower than FP8 with similar quality.
  DATA-001:
    title: Image count in data doesn't match
    what: 'Sample #{idx} has {image_count} images but the text has only {slot_count} image slots, or was cut off for being too long.'
  DATA-002:
    title: Some images are broken or unusual
    what: '{image_count} images can''t be opened or have an unusual format (CMYK, RGBA, too small).'
  DATA-003:
    title: The model doesn't seem to learn
    what: The loss is near zero from the start, usually because the data marks the wrong part to learn.
  DATA-004:
    title: Images missing from data
    what: '{sample_count} samples point to images that don''t exist.'
  DATA-005:
    title: The trial image can't be used
    what:
      missing: '"{node}" has no image yet. Upload a JPG, PNG or WEBP image.'
      unreadable: The image of "{node}" can't be opened or isn't a JPG, PNG or WEBP. Upload another image.
      too_large: The image of "{node}" is larger than 20 MB. Use a smaller image.
      too_many_pixels: The image of "{node}" has too high a resolution (over 40 megapixels). Shrink it and upload it again.
  DATA-006:
    title: Some of the data folder can't be used
    what:
      labels_file: The labels.jsonl file in the folder of "{node}" can't be read (missing, not a file, or too large). Fix the file and check again.
      line_format: '{problem_count} lines of labels.jsonl don''t follow the format, the first is line {first_line}. Each line needs an image name and an answer, as shown in the Docs.'
      image_name: '{problem_count} lines have an invalid or repeated image name, the first is line {first_line}. Each image should appear only once.'
      image_missing: '{problem_count} lines point to an image that isn''t in the folder, the first is line {first_line}. Add the image or remove the line.'
      image_too_large: '{problem_count} images are too large (file size or dimensions), the first is on line {first_line}. Shrink them and check again.'
      image_unreadable: '{problem_count} images can''t be opened, the first is on line {first_line}. Use intact JPG, PNG or WEBP images.'
      no_samples: The folder of "{node}" has no usable sample. Add images and their lines to labels.jsonl.
  MODEL-001:
    title: Can't read the converted model
    what: Parts of the model file don't match the expected format, usually due to a library version difference.
  MODEL-002:
    title: Converted model gives wrong answers
    what: The automatic check found the new model answers very differently from the original.
  NET-001:
    title: Couldn't download model or data
    what: Couldn't reach Hugging Face/NGC, or you're not signed in.
  CFG-001:
    title: These two steps can't connect
    what: '"{a}" outputs {type_a} but "{b}" needs {type_b}.'
  CFG-002:
    title: Steps are connected in a loop
    what: 'The wires form a loop: {nodes}. Each step must run after the previous one and can''t go back.'
  CFG-003:
    title: This step is missing an input
    what: '"{node}" needs "{port}" but nothing is connected.'
  CFG-005:
    title: A setting is not valid
    what: '"{param}" of "{node}" is {value}, but it must {rule}.'
  CFG-006:
    title: A wire points to a missing step
    what: A wire points to "{node_id}", but that step was deleted or renamed.
  CFG-007:
    title: Can't open the workflow file
    what: The file isn't a valid workflow or contains unexpected data ({field}).
  SEC-001:
    title: Path is outside the workspace
    what: '"{path}" is outside the project folder, so the app can''t read or write there.'
  SEC-002:
    title: Workflow contains a password or token
    what: Setting "{param}" seems to contain a token. Store tokens in Settings; the workflow should only refer to them.
  SEC-003:
    title: License doesn't allow this use
    what: The license of {name} doesn't allow {use}.
  SEC-004:
    title: The runtime environment was changed outside the app
    what: The "{image}" environment on this machine no longer matches the version the app verified, so no step was run. This isn't something you did; send a report so the team can restore the right version.
  STD-001:
    title: Something in this step needs a look
    what: 'A setting or the data of "{node}" differs from what is recommended. Open the step to see the details.'
  SYS-000:
    title: An unrecognized error occurred
    what: The app doesn't recognize this error. Progress was saved if possible; you can send a report so the team can fix it.
  SYS-004:
    title: 'App error: GPU step without the lock'
    what: This is an app error, not something you did. The step was stopped before using the GPU, so the machine and other jobs weren't affected.
  ENV-001:
    title: Runtime environment is missing a library
    what: The app's runtime environment is missing a library this model needs ({packages}). This isn't something you did; the app's environment needs an update.
  DISK-003:
    title: Saved results are full; pick what to delete
    what: Saved results are {gb_over} GB over the {cap_gb} GB limit, but the {protected_count} remaining items are protected (trained models, pinned items, exports), so the app won't delete anything itself. Choose what to
      remove in the Storage panel.
