    no_additional_restrictions: Khi chia sẻ, không đặt thêm điều kiện nào hạn chế quyền mà giấy phép này cho người nhận.
    built_on_cosmos: 'Ghi dòng "{notice}" trên website, giao diện hoặc tài liệu liên quan nếu bạn chia sẻ model Cosmos hay model tạo ra từ nó, cung cấp sản phẩm có dùng nó, hoặc dùng nó (kể cả kết quả của nó) để train model khác.'
    eval_only: Chỉ dùng để chấm điểm; không dùng để train hay làm dữ liệu hiệu chỉnh khi nén.
    no_redistribution: Không chia sẻ lại bộ dữ liệu này.
