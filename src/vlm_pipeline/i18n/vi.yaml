method:
  full_sft:
    title: Fine-tune toàn bộ (Full SFT)
    when: 'Khi có nhiều dữ liệu và cần model đổi cách trả lời nhiều nhất; tốn bộ nhớ nhất.'
  lora:
    title: Fine-tune nhẹ (LoRA)
    when: 'Lựa chọn mặc định: dạy thêm nhanh, ít bộ nhớ, model gốc giữ nguyên.'
  qlora:
    title: Fine-tune nhẹ 4-bit (QLoRA)
    when: 'Khi model lớn hơn phần bộ nhớ còn trống: giữ model gốc ở 4-bit rồi dạy LoRA.'
  two_stage:
    title: Train 2 giai đoạn kiểu LLaVA
    when: 'Khi loại ảnh rất mới với model và có nhiều cặp ảnh–chú thích: dạy bộ nối trước, rồi dạy trả lời.'
  vision_unfrozen:
    title: Mở phần nhìn ảnh, ảnh độ phân giải cao
    when: 'Khi ảnh rất khác ảnh thường gặp: dạy cả phần nhìn ảnh với tốc độ học thấp; tốn bộ nhớ hơn.'
  distill:
    title: Chưng cất từ model lớn
    when: 'Khi có ít đáp án mẫu: một model lớn viết đáp án, rồi dạy model nhỏ học theo.'
    note: Kiểm tra giấy phép của model lớn có cho dùng câu trả lời của nó để train model khác không.
  dpo:
    title: Học theo cặp tốt/kém (DPO)
    when: 'Khi có cặp câu trả lời tốt và kém cho cùng ảnh: dạy model chọn câu tốt hơn, bớt bịa chi tiết.'
  grpo:
    title: Học từ phản hồi (GRPO)
    when: 'Khi máy chấm được đúng/sai (số, JSON): model thử nhiều câu và học từ điểm; chạy lâu nhất.'
  ptq:
    title: Nén sau khi train (PTQ)
    when: 'Khi cần model nhỏ hơn để chạy: nén rồi đo lại điểm, không train thêm.'
  qat:
    title: Nén có học lại (QAT)
    when: 'Khi nén làm điểm giảm nhiều: train ngắn có giả lập nén để lấy lại điểm.'
