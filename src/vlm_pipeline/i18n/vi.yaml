        label: Giới hạn số mẫu
        help: Dùng ít mẫu để chạy thử nhanh; chọn "Tất cả" khi chạy thật.
      seed:
        label: Hạt giống ngẫu nhiên (seed)
        help: Giữ nguyên để kết quả chạy lại giống hệt.
  data.local_folder:
    title: Thư mục ảnh + câu hỏi/đáp án
    desc: Dùng ảnh và câu hỏi/đáp án của bạn trong thư mục dự án.
    param:
      path:
        label: Thư mục dữ liệu
        help: Thư mục trong dự án chứa ảnh và file câu hỏi/đáp án.
      max_samples:
        label: Giới hạn số mẫu
        help: Dùng ít mẫu để chạy thử nhanh; chọn "Tất cả" khi chạy thật.
      seed:
        label: Hạt giống ngẫu nhiên (seed)
        help: Giữ nguyên để kết quả chạy lại giống hệt.
      max_image_side_px:
        label: Cạnh ảnh tối đa (px)
        help: Ảnh lớn hơn sẽ bị bỏ qua để tránh tốn RAM (512–8192).
      input_format:
        label: Định dạng file nhãn
        help: Để "Tự nhận biết" nếu không chắc. App đọc được nhãn dạng LLaVA, ShareGPT hoặc hội thoại HF và tự chuyển sang dạng dùng để train.
    port:
      dataset: Dữ liệu
  data.format_vlm_chat:
    title: Chuyển dữ liệu sang dạng hội thoại
    desc: Sắp xếp ảnh và câu hỏi/đáp án theo đúng dạng model cần để học.
  data.split:
    title: Chia dữ liệu học / kiểm tra
    desc: Tách một phần dữ liệu để kiểm tra model sau khi học.
    param:
      val_fraction:
        label: Phần để kiểm tra
        help: Tỉ lệ dữ liệu giữ lại để kiểm tra model, không dùng để học. Thường 10%.
      seed:
        label: Hạt giống ngẫu nhiên (seed)
        help: Giữ nguyên để kết quả chạy lại giống hệt.
    port:
      dataset: Dữ liệu
      train: Dữ liệu học
      val: Dữ liệu kiểm tra
  data.filter:
    title: Lọc dữ liệu
    desc: Bỏ các mẫu có ảnh quá nhỏ, ảnh hỏng hoặc đáp án quá dài, trước khi train.
    param:
      min_short_side_px:
        label: Cạnh ngắn tối thiểu (px)
        help: Ảnh có cạnh ngắn nhỏ hơn số này sẽ bị bỏ, vì quá nhỏ để model đọc được chữ.
      max_target_chars:
        label: Đáp án dài tối đa (ký tự)
        help: Mẫu có đáp án dài hơn số này sẽ bị bỏ, vì dễ bị cắt cụt khi train.
      drop_broken:
        label: Bỏ ảnh hỏng
        help: Bỏ ảnh không mở được hoặc sai định dạng thay vì báo lỗi giữa chừng.
      max_long_side_px:
        label: Cạnh dài tối đa (px)
        help: Ảnh có cạnh dài hơn số này sẽ bị bỏ để tránh tốn RAM.
      max_megapixels:
        label: Kích thước ảnh tối đa (megapixel)
        help: Ảnh lớn hơn số megapixel này sẽ bị bỏ để tránh tốn RAM (tối đa 40).
      min_target_chars:
        label: Đáp án ngắn tối thiểu (ký tự)
        help: Mẫu có đáp án ngắn hơn số này (ví dụ đáp án rỗng) sẽ bị bỏ.
    port:
      dataset: Dữ liệu
  data.dedupe:
    title: Bỏ mẫu trùng
    desc: Bỏ các mẫu trùng nhau, và bỏ mẫu train trùng ảnh với dữ liệu kiểm tra, để điểm đo không cao hơn thực tế.
    param:
      compare:
        label: Cách so trùng
        help: '"Giống hệt" chỉ bỏ file ảnh giống từng byte; "Gần giống" bỏ cả ảnh đã đổi cỡ hoặc nén lại.'
      check_leak:
        label: Bỏ mẫu trùng với dữ liệu kiểm tra
        help: Nếu ảnh dùng để train cũng có trong dữ liệu kiểm tra (cổng "Dữ liệu kiểm tra"), model sẽ được chấm trên chính ảnh nó đã học và điểm sẽ cao hơn thực tế. Nên bật.
      dhash_max_distance:
        label: Độ lệch tối đa khi so gần giống
        help: Chỉ dùng với "Gần giống". Số càng lớn thì càng nhiều ảnh bị coi là trùng (0–16).
    port:
      dataset: Dữ liệu
      heldout: Dữ liệu kiểm tra
  data.caption_vlm:
    title: Tạo mô tả ảnh bằng model
    desc: Dùng một model đọc ảnh để viết câu trả lời cho các mẫu chưa có, rồi dùng làm dữ liệu train. Nên xem lại vài câu trước khi train, vì model có thể viết sai.
    param:
      task:
        label: Model viết gì
        help: '"Mô tả ảnh" viết một đoạn mô tả. "Câu hỏi + trả lời" để model lớn tự đặt một câu hỏi về ảnh và trả lời, làm dữ liệu dạy model nhỏ.'
      qa_focus:
        label: Loại câu hỏi
        help: Model sẽ hỏi về điều gì trong ảnh. Mỗi loại dùng một mẫu câu hỏi cố định của app.
      prompt:
        label: Câu hỏi cho model
        help: Câu yêu cầu gửi kèm mỗi ảnh, ví dụ "Mô tả chi tiết ảnh này".
      max_new_tokens:
        label: Độ dài tối đa (token)
        help: Giới hạn độ dài mỗi câu trả lời (32–1024). Dài hơn thì chạy lâu hơn.
      overwrite_existing:
        label: Ghi đè câu trả lời đã có
        help: Bật thì viết lại cả những mẫu đã có câu trả lời, câu cũ bị thay. Tắt thì chỉ viết cho mẫu chưa có.
    port:
      dataset: Dữ liệu
      model: Model viết mô tả
  data.mix:
    title: Trộn dữ liệu
    desc: Gộp 2 đến 4 bộ dữ liệu thành một bộ để train.
    param:
      strategy:
        label: Cách trộn
        help: '"Nối tiếp" gộp hết mọi mẫu; "Xen kẽ" lấy mẫu theo tỉ lệ đã đặt.'
      weight_1:
        label: Tỉ lệ bộ 1
        help: Chỉ dùng khi xen kẽ. Tỉ lệ tương đối so với các bộ khác.
      weight_2:
        label: Tỉ lệ bộ 2
        help: Chỉ dùng khi xen kẽ. Tỉ lệ tương đối so với các bộ khác.
      weight_3:
        label: Tỉ lệ bộ 3
        help: Chỉ dùng khi xen kẽ và có nối bộ 3.
      weight_4:
        label: Tỉ lệ bộ 4
        help: Chỉ dùng khi xen kẽ và có nối bộ 4.
      seed:
        label: Hạt giống ngẫu nhiên (seed)
        help: Giữ nguyên để kết quả chạy lại giống hệt.
    port:
      dataset_1: Bộ dữ liệu 1
      dataset_2: Bộ dữ liệu 2
      dataset_3: Bộ dữ liệu 3
      dataset_4: Bộ dữ liệu 4
      dataset: Dữ liệu đã trộn
  quantize.qat:
    title: Nén có học lại (QAT)
    desc: Nén model rồi cho học thêm một chút với phép nén giả lập, để lấy lại phần điểm bị mất khi nén.
    param:
      format:
        label: Kiểu nén
        help: Định dạng số mà model dùng sau khi nén.
      adapter:
        label: Cách học lại
        help: '"Nhẹ (LoRA)" chỉ học một phần nhỏ, ít tốn bộ nhớ. "Toàn bộ" học mọi trọng số, chỉ dùng được với model nhỏ.'
      epochs:
        label: Thời lượng học lại
        help: Số lượt model đọc hết dữ liệu. Học lại sau khi nén thường chỉ cần ít.
      lr_preset:
        label: Tốc độ học
        help: Học lại sau khi nén dùng tốc độ thấp để không làm hỏng model. Nên để "Thấp".
      max_steps:
        label: Số bước tối đa
        help: Dừng sau bấy nhiêu bước dù chưa hết lượt (0 = học theo số lượt).
      calib_size:
        label: Số ảnh hiệu chỉnh
        help: Số ảnh dùng để đo khoảng giá trị trước khi nén.
    port:
      model: Model
      train_data: Dữ liệu học lại
      calib_data: Dữ liệu hiệu chỉnh (tuỳ chọn)
      quantized: Model đã nén
  train.dpo_vlm:
    title: Học theo cặp tốt/kém (DPO)
    desc: Dạy model thích câu trả lời tốt hơn, từ các cặp "câu được chọn / câu bị loại" trong dữ liệu.
    param:
      beta:
        label: Mức giữ gần model gốc (beta)
        help: Càng lớn thì model càng ít đi xa khỏi model gốc (0.01–1). Nên giữ mặc định.
      epochs:
        label: Thời lượng huấn luyện
        help: Số lượt model đọc hết dữ liệu.
      lr_preset:
        label: Tốc độ học
        help: Tốc độ model thay đổi theo các cặp câu trả lời. Nên để "Vừa".
      sft_weight:
        label: Học thêm câu được chọn
        help: Ngoài so sánh cặp, model học thẳng câu được chọn với trọng số này (0 = chỉ so sánh).
      lora_dim:
        label: Kích thước LoRA (dim)
        help: Lớn hơn thì học được nhiều hơn nhưng tốn RAM hơn (4–64). Nên giữ mặc định.
      seed:
        label: Hạt giống ngẫu nhiên (seed)
        help: Giữ nguyên để kết quả chạy lại giống hệt.
    port:
      base_model: Model gốc
      train_data: Dữ liệu cặp câu trả lời
      val_data: Dữ liệu kiểm tra (tuỳ chọn)
      adapter: Phần học thêm (LoRA)
  data.preview:
    title: Xem trước dữ liệu
    desc: Xem vài mẫu và các lỗi thường gặp trước khi train.
  train.lora_vlm:
    title: Fine-tune nhẹ (LoRA)
    desc: Dạy model trả lời theo dữ liệu của bạn, tốn ít bộ nhớ.
    param:
      epochs:
        label: Thời lượng huấn luyện
        help: Số lượt model đọc hết dữ liệu. Nhiều lượt hơn thì lâu hơn và dễ học vẹt.
      lr_preset:
        label: Tốc độ học
        help: Chậm an toàn hơn, nhanh học nhanh hơn nhưng dễ hỏng model. Nên giữ "Vừa".
      global_batch_size:
        label: Batch tổng (global_batch_size)
        help: Số mẫu gộp lại cho mỗi lần cập nhật model (4–64).
      local_batch_size:
        label: Batch mỗi lần (local_batch_size)
        help: Số mẫu xử lý cùng lúc (1–4). Tăng lên thì tốn RAM hơn; 1 là an toàn cho máy dùng chung.
      weight_decay:
        label: Hệ số giảm trọng số (weight_decay)
        help: Hệ số chống học vẹt (0–0.1).
      activation_checkpointing:
        label: Tiết kiệm bộ nhớ (activation checkpointing)
        help: Bật thì chậm hơn một chút nhưng tốn ít RAM hơn nhiều. Nên để bật.
      max_recent_checkpoints:
        label: Số điểm khôi phục giữ lại
        help: Giữ bao nhiêu bản lưu gần nhất (1–5). Nhiều hơn thì tốn ổ đĩa hơn.
      seed:
        label: Hạt giống ngẫu nhiên (seed)
        help: Giữ nguyên để kết quả chạy lại giống hệt.
      lora_dim:
        label: Kích thước LoRA (dim)
        help: Lớn hơn thì học được nhiều hơn nhưng tốn RAM hơn (4–64).
      lora_alpha:
        label: LoRA alpha
        help: Độ mạnh của phần học thêm (8–128). Nên giữ mặc định.
      quantize_base:
        label: Nén model gốc khi học (QLoRA)
        help: Nén model gốc xuống 4-bit để tiết kiệm bộ nhớ khi học. Có lợi rõ nhất với model lớn (từ ~9B); chất lượng gần như học thường. Chỉ dùng được với model đã thiết lập sẵn cho QLoRA (hiện là các model Qwen3.5).
      advanced:
        label: Tuỳ chọn engine nâng cao
        help: Các tuỳ chọn của engine train (NeMo AutoModel), giữ nguyên tên gốc. Chỉ đổi khi bạn biết rõ tác dụng; để trống là dùng mặc định đã được kiểm tra. App vẫn kiểm tra giá trị trước khi chạy.
    port:
      base_model: Model gốc
      train_data: Dữ liệu học
      val_data: Dữ liệu kiểm tra (tuỳ chọn)
      adapter: Phần học thêm (LoRA)
  train.sft_vlm:
    title: Fine-tune toàn bộ
    desc: Dạy model trả lời theo dữ liệu của bạn bằng cách cập nhật các phần model cần học.
    port:
      base_model: Model gốc
      train_data: Dữ liệu học
      val_data: Dữ liệu kiểm tra (tuỳ chọn)
      model: Model hoàn chỉnh
    param:
      advanced:
        label: Tuỳ chọn engine nâng cao
        help: Các tuỳ chọn của engine train (NeMo AutoModel), giữ nguyên tên gốc. Chỉ đổi khi bạn biết rõ tác dụng; để trống là dùng mặc định đã được kiểm tra. App vẫn kiểm tra giá trị trước khi chạy.
      epochs:
        label: Thời lượng huấn luyện
        help: Số lượt model đọc hết dữ liệu. Nhiều lượt hơn thì lâu hơn và dễ học vẹt.
      lr_preset:
        label: Tốc độ học
        help: Chậm an toàn hơn, nhanh học nhanh hơn nhưng dễ hỏng model. Nên giữ "Vừa".
      global_batch_size:
        label: Batch tổng (global_batch_size)
        help: Số mẫu gộp lại cho mỗi lần cập nhật model (4–64).
      local_batch_size:
        label: Batch mỗi lần (local_batch_size)
        help: Số mẫu xử lý cùng lúc (1–4). Tăng lên thì tốn RAM hơn; 1 là an toàn cho máy dùng chung.
      weight_decay:
        label: Hệ số giảm trọng số (weight_decay)
        help: Hệ số chống học vẹt (0–0.1).
      activation_checkpointing:
        label: Tiết kiệm bộ nhớ (activation checkpointing)
        help: Bật thì chậm hơn một chút nhưng tốn ít RAM hơn nhiều. Nên để bật.
      max_recent_checkpoints:
        label: Số điểm khôi phục giữ lại
        help: Giữ bao nhiêu bản lưu gần nhất (1–5). Nhiều hơn thì tốn ổ đĩa hơn.
      seed:
        label: Hạt giống ngẫu nhiên (seed)
        help: Giữ nguyên để kết quả chạy lại giống hệt.
      train_blocks:
        label: Phần được train
        help: 'Phần nào của model được học lại; phần còn lại giữ nguyên. Mặc định chỉ train phần ngôn ngữ: nhanh hơn, ít RAM hơn, và ít làm hỏng khả năng nhìn.'
      vision_lr_scale:
        label: Tốc độ học của phần nhìn ảnh
        help: Khi train cả phần nhìn ảnh, tốc độ học của phần đó bằng con số này nhân với tốc độ của phần còn lại (0.05–0.2, tức chậm hơn 5–20 lần), để không làm hỏng khả năng nhìn.
  train.grpo_vlm:
    title: Học từ phản hồi (GRPO)
    desc: Cải thiện model bằng cách chấm điểm các câu trả lời. Dành cho người dùng nâng cao.
    param:
      reward:
        label: Cách chấm điểm
        help: Cách engine chấm câu trả lời so với đáp án trong dữ liệu. "So giá trị" coi 0,5 và 1/2 là như nhau. Không cần viết code.
      epochs:
        label: Thời lượng huấn luyện
        help: Số lượt model đọc hết dữ liệu.
      lr_preset:
        label: Tốc độ học
        help: Tốc độ model thay đổi theo điểm thưởng. Nên để "Vừa".
      num_generations:
        label: Số câu trả lời mỗi câu hỏi
        help: Model viết bấy nhiêu câu trả lời để so với nhau (2–8). Nhiều hơn thì học tốt hơn nhưng chậm và tốn bộ nhớ hơn.
      max_new_tokens:
        label: Độ dài câu trả lời tối đa (token)
        help: Giới hạn độ dài mỗi câu trả lời model viết (32–1024).
      kl_coef:
        label: Mức giữ gần model gốc (KL)
        help: Càng lớn thì model càng ít đi xa khỏi model gốc. Nên giữ mặc định.
      lora_dim:
        label: Kích thước LoRA (dim)
        help: Lớn hơn thì học được nhiều hơn nhưng tốn RAM hơn (4–64). Nên giữ mặc định.
      format_weight:
        label: Điểm cho đúng định dạng
        help: Điểm thưởng khi câu trả lời có đúng dạng mong đợi (một số, một JSON, hoặc khớp mẫu).
      correctness_weight:
        label: Điểm cho đúng đáp án
        help: Điểm thưởng khi câu trả lời đúng so với đáp án.
      seed:
        label: Hạt giống ngẫu nhiên (seed)
        help: Giữ nguyên để kết quả chạy lại giống hệt.
    port:
      base_model: Model gốc
      train_data: Dữ liệu học
      val_data: Dữ liệu kiểm tra (tuỳ chọn)
      adapter: Phần học thêm (LoRA)
  serve.vllm:
    title: Bật model để chạy thử
    desc: Chạy model như một dịch vụ để chat thử hoặc đo tốc độ.
    port:
      model: Model
      endpoint: Model đang chạy thử
    param:
      image:
        label: Ảnh để chạy thử
        help: Tải lên một ảnh JPG, PNG hoặc WEBP (tối đa 20 MB). Ảnh chỉ lưu trên máy này, trong thư mục dự án.
      prompt:
        label: Câu hỏi
        help: Bạn muốn hỏi gì về ảnh, ví dụ "Tổng tiền là bao nhiêu?". Model đọc hoá đơn (Nemotron Parse) luôn làm cùng một việc nên không dùng ô này.
      answer_length:
        label: Độ dài trả lời
        help: Câu trả lời tối đa dài bao nhiêu.
      engine:
        label: Bộ chạy (engine)
        help: vLLM nhanh hơn; HF dùng khi model chưa hỗ trợ vLLM.
      temperature:
        label: Độ sáng tạo (temperature)
        help: 0 = luôn trả lời giống nhau; cao hơn = đa dạng hơn (0–1.5).
      top_p:
        label: Top-p
        help: Giới hạn lựa chọn từ khi sinh câu (0.1–1). Nên giữ 1.
      gpu_memory_utilization:
        label: Phần bộ nhớ dành cho phục vụ
        help: Tỉ lệ bộ nhớ máy giữ cho bộ đệm (0.2–0.5). Cao hơn 0.3 chỉ khi máy rảnh.
      max_model_len:
        label: Độ dài hội thoại tối đa (token)
        help: Câu hỏi + trả lời dài nhất (2048–32768). Dài hơn thì tốn RAM hơn.
  playground.chat:
    title: Chat thử với model
    desc: Gửi ảnh/video và câu hỏi để xem model trả lời.
  quantize.modelopt_ptq:
    title: Nén model
