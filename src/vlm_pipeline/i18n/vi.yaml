gated:
  title: Mở quyền tải model "{model}"
  intro: Model này do {publisher} phát hành và yêu cầu bạn đồng ý điều khoản trước khi tải. Làm một lần, khoảng 5 phút. App không bao giờ thấy mật khẩu của bạn.
  step_count: Bước {step}/{total_count}
  step1:
    title: Tạo hoặc đăng nhập tài khoản Hugging Face
    body: Mở trang Hugging Face, đăng ký miễn phí bằng email (hoặc đăng nhập nếu đã có), rồi xác nhận email.
    open: Mở trang đăng ký
  step2:
    title: Đồng ý điều khoản của model
    body: Mở trang model, đọc điều khoản, rồi bấm nút đồng ý (thường là "Agree and access repository"). Với model này, quyền được cấp ngay sau khi đồng ý.
    open: Mở trang model
    shares_info: Khi đồng ý, Hugging Face sẽ chia sẻ tên tài khoản và email của bạn với {publisher}.
  step3:
    title: Tạo token chỉ đọc
    body: Mở trang Access Tokens → bấm "New token" / "Create new token" → chọn loại "Read" → đặt tên "vlm-app-read" → nếu có ô thời hạn, chọn ngày hết hạn → tạo rồi sao chép token (bắt đầu bằng hf_).
    open: Mở trang Access Tokens
    never_write: 'Đừng chọn loại "Write": app chỉ cần đọc để tải model.'
    risk: Token Read cho phép đọc mọi repo của bạn, kể cả repo riêng tư — đừng chia sẻ token này.
  step4:
    title: Dán token vào app
    body: Dán token vào ô dưới đây rồi bấm Lưu. App lưu token riêng trên máy này, không ghi vào workflow hay nhật ký.
    field: Token Hugging Face
    check: Kiểm tra
  status:
    checking: Đang kiểm tra…
    ok: Xong! Tài khoản {username} đã có quyền tải "{model}".
    invalid_token: Token không hợp lệ hoặc đã bị xoá. Tạo token mới ở bước 3 rồi dán lại.
    not_accepted: Token đúng, nhưng tài khoản {username} chưa đồng ý điều khoản của model. Quay lại bước 2.
    pending_approval: Yêu cầu của bạn đang chờ {publisher} duyệt. Bạn sẽ nhận email khi được duyệt, rồi bấm Kiểm tra lại.
    network_error: Không kết nối được tới Hugging Face. Kiểm tra mạng rồi thử lại.
    write_token_rejected: Token này có quyền ghi nên app không nhận. Tạo token loại "Read" ở bước 3 rồi dán lại.
    write_token_advanced_warning: 'Token có quyền ghi: nếu bị lộ, người khác có thể sửa hoặc xoá repo của bạn. Chỉ dùng nếu bạn hiểu rủi ro.'
    fine_grained_missing_gated: Token fine-grained này chưa có quyền đọc repo gated. Bật quyền đọc repo gated cho token rồi kiểm tra lại.
