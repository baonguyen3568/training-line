# UI copy — single source of truth for all user-visible text (ADR-009, P010, 007 R9). Owner: bao-design.
# Nested YAML. Lookup: node type ids containing dots are ONE key under `node` (e.g. node["train.lora_vlm"].title).
# Variants: key children (e.g. error.CFG-009.what.migratable). Placeholders {name}: sizes *_gb, counts *_count;
# vi.yaml and en.yaml must have identical keys and placeholders (tested). Missing key at runtime → show the key.
# locale: vi
storage:
  group:
    downloaded_model: Model đã tải
    trained_model: Model bạn đã train
    dataset: Dữ liệu
    temp_result: Kết quả tạm (có thể tính lại)
  lock_reason:
    IN_USE_BY_RUNNING_WORKFLOW: Workflow "{workflow}" đang chạy và cần mục này. Chờ chạy xong rồi xoá.
    PINNED_OR_KEEP: Đã được ghim để giữ lại. Bỏ ghim nếu bạn muốn xoá.
    REQUIRED_PARENT_AT_LOAD: Phần học thêm (LoRA) "{child}" vẫn cần model này để chạy. Xoá phần học thêm trước.
    SECURITY_PROTECTED: Được bảo vệ theo quy định an toàn của dự án. Liên hệ quản trị viên nếu cần xoá.
    RUN_NOT_FINISHED: Run "{run}" chưa xong hoặc đang tạm dừng — cần mục này để chạy tiếp.
    WHITELIST: Lịch sử chạy (nhật ký, số đo) luôn được giữ lại.
    GPU_LOCK_HOLDER: Run này đang dùng GPU (hoặc app chưa đọc được trạng thái GPU) nên chưa xoá được. Thử lại khi run chạy xong.
    UNKNOWN_STATUS: Không đọc được trạng thái của run "{run}" nên app giữ lại cho an toàn.
    RUN_INTERRUPTED: Run "{run}" bị gián đoạn. App giữ các bản lưu tới {until} để bạn chạy tiếp; sau đó chỉ giữ lại bản lưu cuối cùng.
    INPUT_OF_RUNNING_ATTEMPT: Lần chạy mới của bước "{node}" đang chạy tiếp từ bản lưu này. Xoá được khi lần chạy đó xong, hoặc khi nó không còn chạy tiếp được nữa.
    GENERATION_UNREADABLE: App không đọc được dữ liệu nội bộ của bước "{node}" nên chưa đặt lại được. Đây không phải lỗi của bạn; hãy báo quản trị viên kiểm tra thư mục outputs/system/node_generations.
    GENERATION_LIMIT: Bước "{node}" đã được đặt lại quá nhiều lần. Hãy xoá bước này rồi kéo một bước mới từ thư viện vào thay.
  attention:
    RUN_INTERRUPTED_EXPIRING: Bước "{node}" (run "{run}") bị gián đoạn. Hãy chạy tiếp trước {until}; sau mốc đó app dọn các bản lưu cũ, chỉ giữ lại bản lưu cuối cùng.
  consequence:
    WILL_REDOWNLOAD:
      default: Workflow "{workflow}" sẽ phải tải lại {gb} GB ở lần chạy sau.
      no_workflow: Sẽ phải tải lại {gb} GB nếu bạn cần dùng lại.
    WILL_RECOMPUTE: Có thể tạo lại, mất khoảng {minutes} phút.
    PERMANENT_LOSS: '"{name}" sẽ mất vĩnh viễn — không khôi phục hay tạo lại y hệt được.'
    RESUME_IMPOSSIBLE: Model vẫn dùng được, nhưng không thể train tiếp run "{run}" từ điểm này.
  reset_step:
    menu: Đặt lại bước
    menu_hint: Xoá mọi lần chạy của bước này để chạy lại từ đầu.
    title: Đặt lại bước này?
    body: App sẽ xoá {attempt_count} lần chạy của bước "{node}" và giải phóng {gb} GB. Lần chạy sau, bước này chạy lại từ đầu.
    downstream: Các bước phía sau dùng kết quả của bước này cũng sẽ chạy lại.
    lost_lead: "Sẽ mất:"
    lost_checkpoints: Các bản lưu (checkpoint) của bước này
    lost_history: Nhật ký và biểu đồ của các lần chạy này
    confirm: Đặt lại bước
    done: Đã đặt lại bước "{node}", giải phóng {gb} GB.
    nothing: Bước này chưa chạy lần nào, không có gì để đặt lại.
    partial: Còn {failed_count} thư mục chưa xoá được; hãy đặt lại bước này lần nữa sau ít phút.
  dialog:
    title: Xoá {item_count} mục, giải phóng {gb} GB?
    typed_confirm: Gõ  {confirm_text}  để xác nhận
    typed_reason_permanent: Mục này không tạo lại được.
    typed_reason_redownload: Phải tải lại {gb} GB.
    cancel: Huỷ
    confirm: Xoá vĩnh viễn
    plan_expired: Danh sách đã cũ (quá 10 phút). Đang kiểm tra lại…
    approval_needed: Tổng dung lượng xoá lớn hơn {threshold_gb} GB nên cần quản trị viên duyệt trước.
  event_done: Đã xoá lúc {time} bởi {who}
  preflight_hint:
    free_temp: Giải phóng {gb} GB từ kết quả tạm
  item_note:
    eval_data_auto_clean: "App sẽ tự dọn sau {days} ngày nếu bạn không xoá trước."
  item:
    temp_result_of_run: Kết quả tạm của run {run_name}
    checkpoint_of_run: Checkpoint {checkpoint} của run {run_name}
    eval_cache_leftover: "Nhật ký và kết quả thô của lần chấm điểm \"{dataset}\" (điểm đã lưu vẫn giữ)"
    eval_data_invalid: "Dữ liệu chấm điểm \"{dataset}\" bị lỗi (app cất riêng lúc {stamp})"
    eval_data_unfinished: "Bản cài dở của dữ liệu chấm điểm \"{dataset}\""
    set_aside_of_run: Bản train cũ đã cất của run {run_name}
  protected_reason:
    TRAINED_MODEL: Model bạn đã train — app không tự xoá. Bạn vẫn xoá được, cần gõ tên để xác nhận.
    MANIFEST_UNREADABLE: Thông tin của lần chạy này bị hỏng nên app không tự xoá. Bạn vẫn xoá tay được, cần gõ tên để xác nhận.
  section:
    auto: App sẽ tự dọn khi cần
    manual: Cần bạn chọn
    kept: Được giữ lại
  panel:
    title: Dung lượng
    refresh: Kiểm tra lại
    empty: Không có gì cần dọn.
    delete_selected: Xoá {item_count} mục đã chọn
    last_used: Dùng lần cuối {time}
    freed: Đã giải phóng {gb} GB.
    skipped_title: "Không xoá được {item_count} mục:"
    cleanup_in_progress: Đang có một lượt dọn dẹp khác chạy. Thử lại sau ít phút.
    admin_command: Lệnh cho quản trị viên
    copy: Sao chép lệnh
    copied: Đã chép
    kept_total: Đang giữ {gb} GB
  skip_reason:
    CONFIRM_REQUIRED: Chưa gõ đúng tên để xác nhận.
    NOT_IN_PLAN: Danh sách đã thay đổi, mục này không còn.
    NOT_APPLICABLE: Mục này hiện không xoá được.
    NOT_EVICTABLE: Mục này đang được dùng hoặc đã bị xoá.
    RUN_DIR_INVALID: Không tìm thấy thư mục của lần chạy này, hoặc nó nằm ngoài thư mục dự án.
    DELETE_FAILED: Xoá không thành công. Thử lại, nếu vẫn lỗi hãy báo quản trị viên.
    STATE_CHANGED: Trạng thái của mục này vừa thay đổi. Bấm "Kiểm tra lại" rồi chọn lại.
error:
  GPU-001:
    title: Phần mềm không tương thích với GPU của máy
    what: Một thành phần được cài cho phiên bản CUDA khác với bản máy này hỗ trợ.
  GPU-002:
    title: Chế độ chạy nhanh không khởi động được
    what: Phần tăng tốc chưa hỗ trợ chip GB10 nên không khởi động được; tắt nó thì bước vẫn chạy, chỉ chậm hơn.
  CACHE-001:
    title: Kết quả cũ bị hỏng, sẽ chạy lại
    what: Kết quả đã lưu của bước "{node}" (lúc {saved_at}) không đọc được nên app sẽ chạy lại bước này, mất khoảng {est_minutes} phút.
    what_no_estimate: Kết quả đã lưu của bước "{node}" (lúc {saved_at}) không đọc được nên app sẽ chạy lại bước này.
  SYS-005:
    title: Bước này hỏng nhiều lần, app đã ngừng thử lại
    what: "Bước \"{node}\" đã chạy {attempt_count} lần mà lần nào cũng hỏng, nên app ngừng tự chạy lại bước này. Hãy xem lỗi của lần chạy gần nhất (đổi thiết lập của bước thì app sẽ chạy lại từ đầu); nếu chưa rõ nguyên nhân, hãy gửi báo cáo lỗi."
    why: Hỏng liên tiếp nhiều lần như vậy thường do thiết lập hoặc do máy, không phải lỗi ngẫu nhiên.
  QNT-001:
    title: Bản nén bị hỏng
    what:
      top1: 'Bản nén từ bước "{node}" chỉ khớp với bản gốc ở {top1_pct}% số từ trên {sample_count} ảnh kiểm tra (cần tối thiểu {limit_top1_pct}%). App không dùng bản nén này; hãy bỏ bước nén hoặc gửi báo cáo lỗi.'
      kl: 'Bản nén từ bước "{node}" chọn từ lệch quá nhiều so với bản gốc trên {sample_count} ảnh kiểm tra. App không dùng bản nén này; hãy bỏ bước nén hoặc gửi báo cáo lỗi.'
  QNT-002:
    title: Bản nén khác bản gốc khá nhiều
    what:
      top1: 'Bản nén từ bước "{node}" khớp với bản gốc ở {top1_pct}% số từ trên {sample_count} ảnh kiểm tra, thấp hơn mức thường gặp ({limit_top1_pct}%). Bản nén vẫn dùng được; hãy đo điểm trước khi dùng thật.'
      kl: 'Bản nén từ bước "{node}" chọn từ lệch nhiều hơn mức thường gặp so với bản gốc trên {sample_count} ảnh kiểm tra. Bản nén vẫn dùng được; hãy đo điểm trước khi dùng thật.'
  SYS-003:
    title: Bước này dừng đột ngột
    what: Bước này dừng giữa chừng mà không báo lý do (có thể do máy khởi động lại hoặc tiến trình bị tắt). Tiến độ đến {checkpoint_step} đã được lưu nếu có.
  DISK-002:
    title: Cần duyệt trước khi dọn dung lượng
    what: Bạn sắp xoá {gb} GB ({item_count} mục), vượt mức {threshold_gb} GB của máy dùng chung nên quản trị viên cần duyệt bằng lệnh. Chưa có gì bị xoá.
  CFG-008:
    title: Có hai bước trùng mã định danh
    what: '{duplicate_count} bước đang dùng chung mã "{node_id}", nên app không biết nối dây vào bước nào. Thường do sửa tay file workflow.'
  CFG-004:
    title: Workflow dùng bước app không có
    what:
      not_installed_trusted: Bước "{node_type}" là node bên thứ 3 chưa được cài trên máy này. Node có trong nguồn tin cậy của app; bạn xem thông tin rồi quyết định có cài không.
      not_installed_unknown: Bước "{node_type}" là node bên thứ 3 không có trong nguồn tin cậy — workflow này do người khác chia sẻ. App không cài theo thông tin trong file.
      not_allowed: Bước "{node_type}" không được phép dùng trên máy này.
  CFG-009:
    title: Workflow tạo bằng phiên bản bước khác
    what:
      migratable: Bước "{node_id}" được tạo với {node_type} bản {workflow_version}, máy này có bản {installed_version}. App có thể chuyển thiết lập sang bản mới; bạn xem thay đổi trước khi áp dụng.
      not_migratable: Bước "{node_id}" được tạo với {node_type} bản {workflow_version}, máy này có bản {installed_version} và không tự chuyển được. Mở bước để chỉnh lại thiết lập.
  CFG-010:
    title: Model này không train được theo cách bạn chọn
    what:
      full_finetune_only: Bước "{node}" dùng LoRA, nhưng {model} chỉ hỗ trợ fine-tune toàn phần. App chưa chạy gì; hãy đổi sang bước fine-tune toàn phần hoặc chọn model khác.
      lora_only: Bước "{node}" dùng fine-tune toàn phần, nhưng {model} chỉ hỗ trợ LoRA. App chưa chạy gì; hãy đổi sang bước LoRA hoặc chọn model khác.
      not_trainable: Bước "{node}" là bước train, nhưng {model} chỉ dùng để chạy thử và đánh giá, không train được. App chưa chạy gì; hãy chọn model khác.
  CFG-011:
    title: Bước này chưa chạy thật được
    what:
      engine_single_gpu: 'Bước "{node}" chưa chạy được: bản engine hiện tại chưa chạy được bước này trên máy chỉ có một GPU. Bạn có thể xoá bước này để chạy phần còn lại.'
      engine_no_vlm_dpo: 'Bước "{node}" chưa chạy được: bản engine hiện tại chưa học được từ cặp câu trả lời có kèm ảnh. Bạn có thể xoá bước này để chạy phần còn lại.'
      generic: 'Bước "{node}" chưa được hỗ trợ chạy thật trong phiên bản này. Bạn có thể xoá bước này để chạy phần còn lại, hoặc chờ bản cập nhật.'
  CFG-013:
    title: 'Bước này chưa nhận cách nối dữ liệu này'
    what:
      hub_train_data: 'Bước "{node}" hiện chỉ học lại từ thư mục ảnh trên máy, chưa dùng bộ dữ liệu tải từ Hugging Face. Hãy nối một bước thư mục ảnh của bạn vào cổng "Dữ liệu học lại".'
      separate_calib_data: 'Bước "{node}" hiện tự hiệu chỉnh bằng chính ảnh dùng để học lại, chưa nhận bộ dữ liệu hiệu chỉnh riêng. Hãy gỡ dây ở cổng "Dữ liệu hiệu chỉnh".'
  CFG-012:
    title: Nhóm bước bị lỗi nên chưa chạy được
    what:
      invalid_definition: 'File workflow có một nhóm bước bị hỏng (thiếu phần hoặc sai định dạng). Hãy xin lại file từ người gửi; nếu file do app tạo ra, hãy gửi báo cáo lỗi.'
      namespace: 'Nhóm "{group}" dùng tên dành riêng cho nhóm có sẵn của app. Nhóm tự tạo phải có tên bắt đầu bằng "user.".'
      name_clash: 'Có hai nhóm cùng tên "{group}", hoặc tên này trùng với một bước có sẵn. Hãy đổi tên một nhóm.'
      bad_mapping: 'Nhóm "{group}" nối cổng hoặc thiết lập tới một bước con không có cổng hay thiết lập đó. Hãy sửa nhóm, hoặc xin lại file từ người gửi.'
      recursion: 'Nhóm "{group}" chứa chính nó ở bên trong. Hãy xoá nhóm "{group}" khỏi phần bên trong của nó.'
      too_deep: 'Nhóm "{group}" lồng quá {limit} cấp. Hãy gộp bớt một cấp.'
      too_many_nodes: 'Khi bung hết các nhóm, workflow có hơn {limit} bước. Hãy chia thành nhiều workflow nhỏ hơn.'
      too_many_edges: 'Khi bung hết các nhóm, workflow có hơn {limit} dây nối. Hãy chia thành nhiều workflow nhỏ hơn.'
      too_many_definitions: 'File workflow định nghĩa hơn {limit} nhóm. Hãy bỏ bớt các nhóm không dùng.'
      id_too_long: 'Tên các bước trong nhóm "{group}" ghép lại quá dài. Hãy đặt tên bước ngắn hơn.'
  EXP-001:
    title: Thiếu văn bản giấy phép để xuất model
    what: App chưa có văn bản giấy phép đã duyệt cho {license_ids}, nên chưa thể xuất model kèm giấy phép. Đây không phải lỗi của bạn; hãy gửi báo cáo để team bổ sung.
  EXP-002:
    title: Chưa xuất được model này
    what: Chưa hỗ trợ xuất {model} ra thư mục dùng ở máy khác (bước "{node}"). Bạn vẫn train, chạy thử và đánh giá được trong app.
  EXP-003:
    title: Bản xuất có thể chứa thông tin bí mật
    what: 'Bản xuất của bước "{node}" có chuỗi trông giống khoá truy cập (token) trong {files}, nên app đã dừng và chưa ghi gì ra ngoài. Xoá khoá đó khỏi file rồi xuất lại; nếu không chắc, hãy gửi báo cáo.'
  EXP-004:
    title: Bản xuất thiếu file model
    what: 'Bản xuất của bước "{node}" thiếu {files}, nên app dừng lại và không coi là đã xuất xong. Đây là lỗi của app, không phải của bạn; hãy gửi báo cáo để team kiểm tra.'
  MEM-001:
    title: Không đủ bộ nhớ cho bước này
    what: Bước này cần khoảng {need_gb} GB nhưng máy chỉ còn {avail_gb} GB trống, vì máy đang dùng chung với ứng dụng khác.
  MEM-002:
    title: Đã tạm dừng để bảo vệ máy
    what: Bộ nhớ trống xuống dưới mức an toàn nên app đã lưu tiến độ và tạm dừng, tránh làm treo máy.
  MEM-003:
    title: Hết bộ nhớ khi đang chạy
    what: Model dùng nhiều bộ nhớ hơn dự kiến giữa chừng, thường do ảnh lớn hoặc câu quá dài.
    why: Ảnh {image_size_px}px với batch {batch_size} cần nhiều bộ nhớ hơn mức máy còn trống.
  MEM-004:
    title: Phục vụ model chiếm quá nhiều bộ nhớ
    what: Thiết lập phục vụ model đang giữ quá nhiều bộ nhớ cho bộ đệm, có thể làm ảnh hưởng ứng dụng khác.
  DISK-001:
    title: Không đủ dung lượng ổ đĩa
    what: Cần khoảng {need_gb} GB để lưu model và kết quả nhưng chỉ còn {avail_gb} GB.
  SYS-001:
    title: Chưa dùng được GPU lúc này
    what:
      busy: Mỗi lúc chỉ chạy được một tác vụ nặng; {who} đang chạy "{job}" từ {since}.
      stale: Khoá máy của {who} cho "{job}" vẫn còn nhưng tiến trình đã dừng. App không tự xoá khoá; cần quản trị viên kiểm tra.
      corrupt: Không đọc được file khoá máy nên app tạm coi máy là đang bận. Hãy báo quản trị viên.
  SYS-002:
    title: Chờ máy rảnh quá lâu
    what:
      lock: 'Workflow đã chờ {minutes} phút nhưng GPU vẫn đang bận với một việc nặng khác.'
      memory: 'Workflow đã chờ {minutes} phút nhưng máy vẫn chưa đủ bộ nhớ trống: cần khoảng {need_gb} GB, đang trống {avail_gb} GB.'
      vram: 'Workflow đã chờ {minutes} phút nhưng GPU vẫn chưa đủ bộ nhớ riêng (VRAM) trống: cần khoảng {need_gb} GB, đang trống {avail_gb} GB.'
      swap: 'Workflow đã chờ {minutes} phút: bộ nhớ trống đủ ({avail_gb} GB) nhưng máy đang dùng gần hết bộ nhớ trao đổi (swap), nên app chưa chạy thêm việc nặng để máy không bị treo. Hãy chờ các việc khác chạy xong rồi thử lại.'
  GPU-003:
    title: Kiểu nén này chạy chậm trên máy
    what: NVFP4 trên máy này có thể chạy chậm hơn FP8 mà chất lượng tương đương.
  DATA-001:
    title: Số ảnh trong dữ liệu không khớp
    what: 'Mẫu #{idx} có {image_count} ảnh nhưng đoạn văn chỉ có {slot_count} chỗ đặt ảnh, hoặc bị cắt mất vì quá dài.'
  DATA-002:
    title: Có ảnh bị hỏng hoặc sai định dạng
    what: '{image_count} ảnh không mở được hoặc có định dạng lạ (CMYK, RGBA, quá nhỏ).'
  DATA-003:
    title: Model có vẻ không học được gì
    what: Sai số gần 0 ngay từ đầu, thường do dữ liệu đánh dấu sai phần cần học.
  DATA-004:
    title: Thiếu ảnh trong dữ liệu
    what: '{sample_count} mẫu dữ liệu trỏ tới ảnh không tồn tại.'
  DATA-005:
    title: Ảnh để chạy thử chưa dùng được
    what:
      missing: Bước "{node}" chưa có ảnh. Hãy tải lên một ảnh JPG, PNG hoặc WEBP.
      unreadable: Ảnh của bước "{node}" không mở được hoặc không phải JPG, PNG, WEBP. Hãy tải lên ảnh khác.
      too_large: Ảnh của bước "{node}" lớn hơn 20 MB. Hãy dùng ảnh nhỏ hơn.
      too_many_pixels: Ảnh của bước "{node}" có độ phân giải quá lớn (trên 40 triệu điểm ảnh). Hãy thu nhỏ ảnh rồi tải lại.
  DATA-006:
    title: Thư mục dữ liệu có chỗ chưa dùng được
    what:
      labels_file: Không đọc được file labels.jsonl trong thư mục của bước "{node}" (thiếu, không phải file, hoặc quá lớn). Sửa file rồi bấm Kiểm tra lại.
      line_format: Có {problem_count} dòng trong labels.jsonl chưa đúng mẫu, dòng đầu tiên là dòng {first_line}. Mỗi dòng cần ghi tên ảnh và câu trả lời theo mẫu trong Tài liệu.
      image_name: Có {problem_count} dòng có tên ảnh không hợp lệ hoặc bị trùng, dòng đầu tiên là dòng {first_line}. Mỗi ảnh chỉ nên xuất hiện một lần.
      image_missing: Có {problem_count} dòng trỏ tới ảnh không có trong thư mục, dòng đầu tiên là dòng {first_line}. Thêm ảnh hoặc xoá dòng đó.
      image_too_large: Có {problem_count} ảnh quá lớn (dung lượng hoặc kích thước), ảnh đầu tiên ở dòng {first_line}. Thu nhỏ ảnh rồi bấm Kiểm tra lại.
      image_unreadable: Có {problem_count} ảnh không mở được, ảnh đầu tiên ở dòng {first_line}. Dùng ảnh JPG, PNG hoặc WEBP còn nguyên vẹn.
      no_samples: Thư mục của bước "{node}" không có mẫu nào dùng được. Thêm ảnh và dòng tương ứng vào labels.jsonl.
  DATA-007:
    title: Không dùng dữ liệu chấm điểm để train hay nén
    what: 'Bước "{node}" đọc thư mục data/eval, nơi lưu đề thi dùng để chấm điểm model; học hay hiệu chỉnh khi nén trên chính đề thi thì điểm số mất ý nghĩa, nên bước "{target_node}" chưa chạy. Hãy chọn thư mục dữ liệu khác.'
  MODEL-001:
    title: Không đọc được model sau khi chuyển đổi
    what: Các phần trong file model không khớp định dạng mong đợi, thường do khác phiên bản thư viện.
  MODEL-002:
    title: Model sau chuyển đổi trả lời sai
    what: Bước kiểm tra tự động thấy model mới trả lời khác hẳn model gốc.
  NET-001:
    title: Không tải được model hoặc dữ liệu
    what: Không kết nối được tới Hugging Face/NGC, hoặc bạn chưa đăng nhập.
  NET-002:
    title: 'Model hoặc dữ liệu chưa sẵn sàng trên máy'
    what:
      not_cached: '"{repo}" chưa được tải về máy này. Bước chạy không dùng mạng nên cần có sẵn; bấm "Tải về máy" rồi chạy lại.'
      not_prepared: '"{repo}" đã tải về nhưng chưa được chuẩn bị để chạy, vì model này cần thêm một bước chuẩn bị. Bấm "Tải về máy": app làm nốt bước đó, không tải lại phần đã có.'
      not_pinned: 'Bộ dữ liệu "{repo}" chưa có trong danh mục đã kiểm tra của app, nên app không tải nó. Hãy chọn một bộ dữ liệu khác trong danh mục.'
  NET-003:
    title: "Tệp tải về không khớp bản gốc"
    what:
      mismatch: 'Một tệp của "{name}" không khớp chữ ký của bản đã kiểm tra, nên app đã bỏ tệp đó và không cài. Hãy tải lại; nếu vẫn lỗi, hãy gửi báo cáo.'
      cached_differs: 'Bản "{name}" đang có trong bộ nhớ đệm khác bản gốc ở cùng phiên bản, nên app không dùng và không ghi đè. Hãy xoá bản đó trong bảng Dung lượng rồi tải lại.'
  NET-004:
    title: "Model vượt dung lượng cho phép"
    what:
      quota: 'Lần tải này cần {size_gb} GB, vượt hạn mức tải {quota_gb} GB do quản trị viên đặt. Hãy nhờ quản trị viên nới hạn mức, hoặc chọn model nhỏ hơn.'
      model_cap: 'Model này cần {size_gb} GB, vượt mức tối đa {quota_gb} GB cho mỗi model bạn tự thêm. Bạn có thể nâng mức này trong Cài đặt, hoặc chọn model nhỏ hơn.'
  NET-005:
    title: 'Không đọc được repo trên Hugging Face'
    what:
      not_found: 'Không tìm thấy repo "{repo}" trên Hugging Face. Hãy kiểm tra lại tên (dạng tổ-chức/tên-repo).'
      not_found_or_private: 'Không tìm thấy repo "{repo}", hoặc đây là repo riêng tư. Nếu repo riêng tư, hãy lưu token Hugging Face trong Cài đặt rồi thử lại.'
      gated_no_token: 'Repo "{repo}" yêu cầu đăng nhập và đồng ý điều khoản. Hãy lưu token Hugging Face trong Cài đặt.'
      gated_not_accepted: 'Tài khoản Hugging Face của bạn chưa được duyệt dùng repo "{repo}". Mở trang repo, đồng ý điều khoản, rồi thử lại.'
      network: 'Không kết nối được tới Hugging Face để đọc repo "{repo}". Hãy kiểm tra mạng rồi thử lại.'
  MODEL-003:
    title: 'Kiến trúc model này chưa được hỗ trợ'
    what: 'Model "{repo}" dùng kiến trúc {architecture} ({model_type}), app chưa train được kiến trúc này. Hãy chọn một model khác, hoặc đề nghị hỗ trợ kiến trúc này.'
  MODEL-004:
    title: 'Model này chưa dùng được vì lý do an toàn'
    what:
      remote_code: 'Model "{repo}" cần chạy mã Python đi kèm, mà app không chạy mã của model bạn tự thêm. Hãy chọn model khác, hoặc đề nghị đưa model này vào danh mục đã kiểm chứng.'
      unreadable_config: 'Tệp cấu hình "{file}" của model "{repo}" quá lớn nên app không kiểm tra được an toàn, vì vậy app không dùng model này. Hãy chọn model khác, hoặc đề nghị đưa model này vào danh mục đã kiểm chứng.'
    why: 'Để an toàn, app chỉ chạy mã của những model đã được đội ngũ kiểm tra.'
  MODEL-005:
    title: 'Nên chạy thử nhanh trước'
    what: 'Model "{model}" do bạn tự thêm nên chưa được kiểm chứng. Nên chạy thử nhanh vài bước ở bước "{node}" trước khi huấn luyện thật.'
  MODEL-006:
    title: 'Workflow dùng model chưa có trên máy này'
    what: 'Workflow này dùng model "{repo}" do tác giả tự thêm, còn máy này chưa có. Bấm "Thêm model này" để thêm đúng bản tác giả đã dùng; bạn vẫn xem và xác nhận giấy phép trước khi tải.'
  SEC-005:
    title: 'Chưa xác nhận giấy phép'
    what: 'Bạn cần đọc và xác nhận giấy phép ({license}) của "{name}" trước khi app tải về.'
  SEC-006:
    title: 'Chưa xuất được vì giấy phép của model chưa rõ'
    what: 'Model "{name}" chưa ghi rõ giấy phép, nên app chưa cho xuất ra ngoài. Bạn vẫn huấn luyện và thử trong app được; muốn xuất thì dùng model có giấy phép rõ ràng.'
  DATA-009:
    title: 'Bộ dữ liệu này cần chạy mã riêng'
    what:
      has_parquet_export: 'Bộ dữ liệu "{repo}" được nạp bằng mã Python riêng, app không chạy mã đó. Hugging Face có sẵn bản chuyển đổi sang tệp dữ liệu; bấm "Dùng bản chuyển đổi" để app đọc bản đó.'
      not_has_parquet_export: 'Bộ dữ liệu "{repo}" được nạp bằng mã Python riêng, app không chạy mã đó. Hãy chọn bộ dữ liệu khác có sẵn tệp dữ liệu (parquet, json hoặc thư mục ảnh).'
  DATA-010:
    title: 'Chưa ghép đủ cột dữ liệu'
    what:
      image: 'Bộ dữ liệu "{repo}" chưa có cột ảnh được ghép. Các cột hiện có: {available}.'
      question: 'Bộ dữ liệu "{repo}" chưa có cột câu hỏi được ghép. Các cột hiện có: {available}.'
      answer: 'Bộ dữ liệu "{repo}" chưa có cột câu trả lời được ghép. Các cột hiện có: {available}.'
      messages: 'Bộ dữ liệu "{repo}" chưa có cột hội thoại (messages) được ghép. Các cột hiện có: {available}.'
  DATA-011:
    title: 'Cột dữ liệu không đúng loại'
    what: 'Cột "{column}" của "{repo}" chứa {found}, không dùng làm {role} được (cần {expected}). Hãy chọn cột khác.'
  DATA-012:
    title: 'Không đọc được bộ dữ liệu'
    what:
      no_data_files: 'Bộ dữ liệu "{repo}" không có tệp dữ liệu nào app đọc được (parquet, json, csv hoặc thư mục ảnh). Hãy chọn bộ dữ liệu khác.'
      unreadable_sample: 'Tệp dữ liệu mẫu của "{repo}" bị hỏng hoặc sai định dạng nên app không đọc được. Hãy chọn bộ dữ liệu khác.'
      sample_too_large: 'Mọi tệp dữ liệu của "{repo}" đều quá lớn (trên {limit_mb} MB mỗi tệp) nên app không xem trước được. Hãy chọn bộ dữ liệu khác có tệp nhỏ hơn.'
  DATA-013:
    title: 'Workflow dùng bộ dữ liệu chưa có trên máy này'
    what: 'Workflow này dùng bộ dữ liệu "{repo}" do tác giả tự thêm, còn máy này chưa có. Bấm "Thêm bộ dữ liệu này" để thêm đúng bản tác giả đã dùng; bạn vẫn xem và xác nhận giấy phép trước khi tải.'
  DATA-014:
    title: 'Bộ dữ liệu này đang được dùng'
    what: 'Bộ dữ liệu "{name}" đang được tải về hoặc có bước đang chạy đọc nó, nên chưa đổi hay xoá được. Đợi xong rồi thử lại.'
  CFG-001:
    title: Hai bước này không nối được với nhau
    what: Đầu ra của "{a}" là {type_a} nhưng "{b}" cần {type_b}.
  CFG-002:
    title: Các bước đang nối thành vòng tròn
    what: 'Dây nối tạo thành một vòng: {nodes}. Mỗi bước phải chạy sau bước trước, không quay lại được.'
  CFG-003:
    title: Bước này còn thiếu đầu vào
    what: '"{node}" cần "{port}" nhưng chưa có dây nối vào.'
  CFG-005:
    title: Một thiết lập không hợp lệ
    what:
      default: '"{param}" của "{node}" đang là {value}, nhưng phải {rule}.'
      advanced_type: 'Tuỳ chọn engine "{key}" của bước "{node}" sai kiểu giá trị (đang là {value}). Hãy nhập đúng kiểu ghi trong "?" của tuỳ chọn này.'
      advanced_range: 'Tuỳ chọn engine "{key}" của bước "{node}" đang là {value}, nằm ngoài khoảng cho phép. Xem khoảng trong "?" của tuỳ chọn này.'
      advanced_choice: 'Tuỳ chọn engine "{key}" của bước "{node}" đang là {value}, không thuộc các lựa chọn có sẵn. Hãy chọn một giá trị trong danh sách.'
      advanced_resolver: 'Tuỳ chọn engine "{key}" của bước "{node}" dùng biểu thức tham chiếu tới giá trị khác, app không cho phép. Hãy nhập một giá trị cụ thể.'
      advanced_not_offered: 'Engine của bước "{node}" không có tuỳ chọn "{key}" ở phiên bản này. Hãy xoá tuỳ chọn đó.'
      advanced_too_many: 'Bước "{node}" có quá nhiều tuỳ chọn engine đã đổi. Hãy bỏ bớt những tuỳ chọn không cần.'
      advanced_not_for_model: 'Tuỳ chọn engine "{key}" không dùng được với model đang nối vào bước "{node}". Hãy xoá tuỳ chọn đó hoặc đổi model.'
      advanced: 'Một tuỳ chọn engine của bước "{node}" không hợp lệ. Mở mục Nâng cao của bước này để xem và sửa.'
      qlora_not_for_model: 'Model đang nối vào bước "{node}" chưa được thiết lập để nén 4-bit khi huấn luyện (QLoRA). Hãy đặt "{param}" về "Không nén" hoặc chọn model khác.'
      blocks_not_for_model: 'App chưa biết các khối (phần nhìn ảnh, bộ nối) của model đang nối vào bước "{node}", nên chưa train theo khối được. Hãy đặt "{param}" về "Phần ngôn ngữ" hoặc chọn model khác.'
  CFG-006:
    title: Có dây nối tới bước không tồn tại
    what: Một dây trỏ tới "{node_id}" nhưng bước này đã bị xoá hoặc đổi tên.
  CFG-007:
    title: Không mở được file workflow
    what: File không đúng định dạng workflow hoặc có thông tin lạ ({field}).
  SEC-001:
    title: Đường dẫn nằm ngoài thư mục làm việc
    what: '"{path}" nằm ngoài thư mục dự án nên app không được đọc hay ghi ở đó.'
  SEC-002:
    title: Workflow đang chứa mật khẩu hoặc token
    what: Thiết lập "{param}" có vẻ chứa token. Hãy lưu token trong Cài đặt, workflow chỉ tham chiếu tới nó.
  SEC-003:
    title: Giấy phép không cho phép dùng thế này
    what: Giấy phép của {name} không cho phép {use}.
  SEC-004:
    title: Môi trường chạy đã bị thay đổi ngoài app
    what: Môi trường "{image}" trên máy không còn khớp bản app đã kiểm tra, nên app chưa chạy bước nào để tránh rủi ro. Đây không phải lỗi của bạn; hãy gửi báo cáo để team cài lại bản đúng.
  STD-001:
    title: Có điểm cần xem lại ở bước này
    what: Một thiết lập hoặc dữ liệu của bước "{node}" khác với khuyến nghị. Mở bước để xem chi tiết.
  SYS-000:
    title: Đã xảy ra lỗi chưa được nhận diện
    what: App chưa biết lỗi này. Tiến độ đã được lưu nếu có; bạn có thể gửi báo cáo để team sửa.
  SYS-004:
    title: 'Lỗi của app: chạy GPU khi chưa giữ khoá'
    what: Đây là lỗi của app, không phải do bạn. Bước này đã được dừng trước khi dùng GPU nên máy và các tác vụ khác không bị ảnh hưởng.
  ENV-001:
    title: Môi trường chạy thiếu thư viện
    what: Môi trường chạy của app thiếu thư viện model này cần ({packages}). Đây không phải lỗi của bạn; app cần được cập nhật môi trường.
  DISK-003:
    title: Kết quả lưu tạm đầy, cần bạn chọn mục xoá
    what: Kết quả lưu tạm đã vượt mức {cap_gb} GB thêm {gb_over} GB, nhưng {protected_count} mục còn lại thuộc loại được bảo vệ (model đã train, mục đã ghim, bản xuất) nên app không tự xoá. Hãy chọn mục muốn xoá trong bảng Dung lượng.
