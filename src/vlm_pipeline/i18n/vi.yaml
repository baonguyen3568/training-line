reference_pipeline:
  qat-qwen35:
    summary: 'Nén Qwen3.5 rồi học lại ngắn với phép nén giả lập để lấy lại điểm bị mất.'
  dpo-qwen35:
    summary: 'Dạy Qwen3.5 chọn câu trả lời tốt hơn từ các cặp câu được chọn và bị loại.'
  distill-synthetic-qwen35:
    summary: 'Model lớn viết câu hỏi và đáp án cho ảnh, rồi model Qwen3.5 nhỏ học theo.'
  vision-unfrozen-qwen35-2b:
    summary: 'Dạy Qwen3.5-2B cả phần nhìn ảnh với tốc độ học thấp, dùng ảnh độ phân giải cao.'
  two-stage-qwen35-2b:
    summary: 'Với Qwen3.5-2B, dạy bộ nối ảnh–chữ trước, rồi dạy cách trả lời bằng LoRA.'
