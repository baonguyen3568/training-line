    stage2: Bộ nối + LoRA
  qlora-4bit-qwen35-2b:
    summary: Dạy nhẹ Qwen3.5-2B bằng QLoRA, nén phần ngôn ngữ xuống 4-bit cho đỡ tốn bộ nhớ.
  invoice-to-json:
    summary: 'Dạy lại bộ nối và phần ngôn ngữ của Nemotron Parse để đọc hoá đơn CORD-v2 ra JSON.'
  invoice-qwen35-2b-lora:
    summary: Dạy nhẹ Qwen3.5-2B bằng LoRA để đọc hoá đơn ra JSON, chấm cùng bộ với mẫu Đọc hoá đơn.
  image-video-understanding:
    summary: 'Dạy nhẹ Qwen3.5-2B bằng LoRA, đo trên hoá đơn CORD-v2; đổi dữ liệu để dạy việc khác.'
  quantize-fp8-benchmark:
    summary: 'Nén Qwen3.5-2B xuống FP8 rồi đo lại điểm cùng điều kiện với bản gốc.'
