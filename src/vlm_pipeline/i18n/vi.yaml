reference_pipeline:
  invoice-to-json:
    summary: Dạy model đọc ảnh hoá đơn và trả về JSON. Chạy ngay với bộ hoá đơn mẫu CORD-v2.
  invoice-qwen35-2b-lora:
    summary: Dạy nhẹ Qwen3.5-2B bằng LoRA để đọc hoá đơn ra JSON, chấm cùng bộ với mẫu Đọc hoá đơn.
  image-video-understanding:
    summary: Dạy model nhỏ trả lời câu hỏi về ảnh của bạn bằng LoRA. Chưa hỗ trợ video.
  quantize-fp8-benchmark:
    summary: Nén model xuống FP8 rồi đo lại điểm, để thấy chất lượng giảm bao nhiêu.
  gemma4-e4b-lora:
    summary: Dạy nhẹ Gemma 4 E4B trên hoá đơn CORD-v2, chấm cùng bộ kiểm tra với mẫu Đọc hoá đơn.
  qwen35-4b-lora:
    summary: Dạy nhẹ Qwen3.5-4B trên dữ liệu của bạn. Lớn hơn mẫu Hiểu ảnh, cần nhiều bộ nhớ hơn.
  grpo-geometry:
    summary: Dạy model giải hình học bằng cách chấm điểm từng câu trả lời (GRPO). App chưa có bước này.
  dgx-spark-vlm-playbook:
    summary: Hướng dẫn của NVIDIA để fine-tune model ảnh trên DGX Spark, so sánh trước và sau.
  donut-cord:
    summary: Model Donut đọc hoá đơn CORD, làm mốc so sánh. Chạy bằng công cụ khác, không trong app.
  curator-image-curation:
    summary: Lọc ảnh kém và bỏ ảnh trùng bằng model. Bản này dùng bước lọc chạy bằng CPU của app.
  cosmos-reason2-lora:
    summary: Dạy nhẹ Cosmos Reason2 2B trên dữ liệu của bạn. Cần tài khoản Hugging Face.
