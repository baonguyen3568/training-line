# Error catalog — single source of truth for error CODES (owner: bao-fixcode; Proposal 007 R9).
# No user text here: titles/explanations live in src/vlm_pipeline/i18n/{vi,en}.yaml under
#   error.<code>.title | error.<code>.what[.<variant>] | error.<code>.why (OPTIONAL)   and   action.<id>
#   `why` is shown only when every placeholder it uses is present in the runtime params; otherwise omitted.
# Exceptions / validate Issues / events carry only {code, params (+ node_id, port, technical_detail, resumable)}.
#
# Entry fields
#   slug                 engineer-only name (logs, tests); UI shows `code`
#   severity             error | warn | info   (actions required only for `error`)
#   prevent_in_preflight true when graph validate / preflight can catch it before Run (same code as at runtime)
#   params               names, or {name, type: enum|bool|..., values} for params used by variants / `when`;
#                        `ref: node|node_list|port|param|port_type` = the value is an internal id that
#                        error_catalog.display_params swaps for its localized label before rendering
#                        naming: sizes *_gb, counts *_count, lists *_ids, durations *_minutes, times *_at
#   variant_by / variants  text variants -> error.<code>.what.<value|key>
#   match                how a raw failure maps to this code: {kind: regex|exit|preflight|validate|api|executor, value}
#   actions              {id, kind: patch|resume|navigate, target?, patch?, confirm, when?}
#                        patch  = change node params (confirm=false: apply + diff + undo; true: preview first)
#                        resume = continue a run; navigate = open a screen/node (destructive ops ALWAYS navigate
#                        to a dry-run screen, never patch). `when: {param: value}` filters available_actions().
#                        `resumable` is set by the executor from a REAL checkpoint, never guessed.
#                        `effect: memory` marks memory-reducing actions. With the failing node's params + NodeSpec
#                        bounds, a patch is offered only if it would really change the node; when no memory action
#                        is left the server sets `already_optimized: true` in the error record
#                        (UI: error_card.already_optimized).
# Codes are never renamed or reused; retire with `deprecated: true`.

MEM-001:
  slug: MEM_INSUFFICIENT
  severity: error
  prevent_in_preflight: true
  # max_free_pct: share of the free memory a job may use (user rule ADR-005 A1, default 80).
  # memory: host (default) | vram (discrete GPU budget, D-4).
  params: [need_gb, avail_gb, est_peak_gb, est_gb, max_free_pct, {name: memory, type: enum, values: [host, vram]}]
  match:
    - {kind: preflight, value: NO_MEM}
  actions:
    - {id: use_lora, kind: patch, patch: [{param: method, op: set, value: lora}], confirm: false, effect: memory}
    - {id: use_qlora, kind: patch, patch: [{param: method, op: set, value: qlora}], confirm: false, effect: memory}
    - {id: reduce_image_size, kind: patch, patch: [{param: max_pixels, op: scale, value: 0.5}], confirm: false, effect: memory}
    - {id: reduce_batch, kind: patch, patch: [{param: local_batch_size, op: scale, value: 0.5}], confirm: false, effect: memory}
    - {id: smaller_model, kind: navigate, target: "node:model", confirm: false}
    - {id: queue_until_memory, kind: navigate, target: queue_until_memory, confirm: false}
    - {id: see_memory_usage, kind: navigate, target: memory_panel, confirm: false}

MEM-002:
  slug: MEM_PREEMPTED
  severity: warn
  prevent_in_preflight: false
  params: [avail_gb, abort_gb, checkpoint_step, {name: resumable, type: bool}]
  match:
    - {kind: exit, value: "75"}
  actions:
    - {id: resume_checkpoint, kind: resume, confirm: true, when: {resumable: true}}
    - {id: resume_lighter, kind: resume, patch: [{param: activation_checkpointing, op: set, value: true}], confirm: true, when: {resumable: true}, effect: memory}

MEM-003:
  slug: UMA_OOM
  severity: error
  prevent_in_preflight: false
  params: [step, checkpoint_step, image_size_px, batch_size, {name: resumable, type: bool}]  # last two from job config
  match:
    # "CUDA error: out of memory" is torch.AcceleratorError (allocation / context creation, e.g. while another
    # process maps memory on GB10's shared pool), not torch.OutOfMemoryError.
    - {kind: regex, value: "torch\\.OutOfMemoryError|CUDA out of memory|CUDA error: out of memory|NV_ERR_NO_MEMORY|cudaErrorMemoryAllocation"}
    - {kind: exit, value: "137+oom_killed"}
  actions:
    - {id: reduce_max_length, kind: patch, patch: [{param: max_seq_len, op: scale, value: 0.5}], confirm: false, effect: memory}
    - {id: enable_grad_checkpointing, kind: patch, patch: [{param: activation_checkpointing, op: set, value: true}], confirm: false, effect: memory}
    - {id: reduce_batch, kind: patch, patch: [{param: local_batch_size, op: scale, value: 0.5}], confirm: false, effect: memory}
    - {id: resume_checkpoint, kind: resume, confirm: true, when: {resumable: true}}
    - {id: queue_until_memory, kind: navigate, target: queue_until_memory, confirm: false}
    - {id: see_memory_usage, kind: navigate, target: memory_panel, confirm: false}

MEM-004:
  slug: SERVE_MEM_TOO_HIGH
  severity: error
  prevent_in_preflight: true
  params: [gpu_memory_utilization]
  match:
    - {kind: validate, value: "serve.gpu_memory_utilization > 0.3"}
    - {kind: regex, value: "No available memory for the cache blocks"}
  actions:
    - {id: safe_serving_default, kind: patch, patch: [{param: gpu_memory_utilization, op: set, value: 0.25}], confirm: false, effect: memory}
    - {id: reduce_max_length, kind: patch, patch: [{param: max_model_len, op: scale, value: 0.5}], confirm: false, effect: memory}

DISK-001:
  slug: DISK_FULL
  severity: error
  prevent_in_preflight: true
  params: [need_gb, avail_gb, checkpoint_step, {name: resumable, type: bool}]
  match:
    - {kind: preflight, value: NO_DISK}
    - {kind: regex, value: "No space left on device|ENOSPC"}
  actions:
    - {id: free_space, kind: navigate, target: cleanup_dry_run, confirm: false}
    - {id: fewer_checkpoints, kind: patch, patch: [{param: max_recent_checkpoints, op: set, value: 1}], confirm: false}
    - {id: resume_checkpoint, kind: resume, confirm: true, when: {resumable: true}}

DISK-002:
  slug: STORAGE_APPROVAL_REQUIRED
  severity: info
  prevent_in_preflight: true
  params: [gb, threshold_gb, item_count, item_ids, admin_command]
  match:
    - {kind: api, value: "POST /api/storage/apply 403 approval_required"}
  actions:
    - {id: show_admin_command, kind: navigate, target: admin_command, confirm: false}

DISK-003:
  slug: STORAGE_CACHE_FULL_PROTECTED
  severity: warn
  prevent_in_preflight: false
  # Node-output cache is over its cap but everything left is protected (trained models, pinned, exports, parents
  # still needed): the app never deletes those by itself; the user chooses in the Storage panel (dry-run + confirm).
  # Signal: artifacts.cache_retention.plan_cache(...).shortfall_bytes > 0.
  params: [gb_over, cap_gb, protected_count]
  match:
    - {kind: executor, value: "plan_cache shortfall_bytes > 0"}
  actions:
    - {id: free_space, kind: navigate, target: cleanup_dry_run, confirm: false}

STD-001:
  slug: STANDARD_NOT_MET
  severity: error
  prevent_in_preflight: true
  # One code for every rule of configs/standards/*.yaml (P4-2, bao-cleancode): adding a rule = YAML + i18n only.
  # The Issue carries its own severity (error | warn | info, "hint" maps to info). The app renders `what` from the
  # rule's own i18n key in `message` (must be under standards.*); error.STD-001.what is only the fallback.
  # rule = rule id; node = the node id (ref); param = the node param the rule checks (ref); the rest is the UNION of
  # the check fields of every kind in graph/standards.py (a cleancode test keeps this list in sync).
  params:
    - rule
    - message
    - {name: node, ref: node}
    - {name: param, ref: param}
    - value
    - values
    - min
    - max
    - other
    - catalog_field
    - allowed
    - max_epochs
    - small_data_below
    - split
    - below
    - above
    - metric
    - method
    - match
    - above_count
    - min_short_side_px
    - limit_from_catalog
    - target
    - flag
  match:
    - {kind: validate, value: "configs/standards rule failed (graph.standards)"}
  actions:
    - {id: open_node, kind: navigate, target: "node:self", confirm: false}

SYS-001:
  slug: GPU_LOCK_BUSY
  severity: info
  prevent_in_preflight: true
  # state from gpu_lock / preflight: busy (holder alive) | stale (holder PID gone: tell PM, never auto-delete)
  # | corrupt (unreadable lock: who/job/since are unknown, the text must not use them)
  params: [who, job, since, {name: state, type: enum, values: [busy, stale, corrupt]}]
  variant_by: state
  match:
    - {kind: preflight, value: LOCK_BUSY}
  actions:
    - {id: queue, kind: navigate, target: run_queue, confirm: false}
    - {id: cancel_run, kind: navigate, target: cancel_run, confirm: false}

SYS-004:
  slug: GPU_LOCK_NOT_HELD
  severity: error
  prevent_in_preflight: false
  # A worker/job started without holding the GPU lock token (gpu_lock.verify_token): a runner bug, not a user
  # mistake. The job is stopped before touching the GPU.
  params: []
  match:
    - {kind: executor, value: "gpu_lock.verify_token: GPU lock not held / held by another job"}
  actions:
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

SYS-002:
  slug: GPU_LOCK_TIMEOUT
  severity: warn
  prevent_in_preflight: false
  # waiting_for: what the queue waited for. memory = the host's free RAM under the 80%-of-free rule (ADR-005 A1),
  # vram = a discrete GPU's free VRAM (D-4); both carry need_gb / avail_gb. swap = enough free RAM but the host's
  # free swap stays under min_swap_free_gb (the host is under memory pressure). Absent (older emitters) = lock.
  params:
    - minutes
    - {name: waiting_for, type: enum, values: [lock, memory, vram, swap]}
    - need_gb
    - avail_gb
  variants:
    - {when: {waiting_for: memory}, key: memory}
    - {when: {waiting_for: vram}, key: vram}
    - {when: {waiting_for: swap}, key: swap}
    - {when: {}, key: lock}
  match:
    - {kind: executor, value: queue_wait_timeout}
  actions:
    - {id: keep_waiting, kind: navigate, target: run_queue, confirm: false}
    - {id: cancel_run, kind: navigate, target: cancel_run, confirm: false}

ENV-001:
  slug: ENV_MISSING_PACKAGE
  severity: error
  prevent_in_preflight: false
  # The job image lacks a Python package a model needs (typically imports in trust_remote_code files, e.g. a
  # processor needing albumentations/cv2). Runner order: error event code > this log match > SYS-003.
  # `packages` = missing module names parsed from the log; image name/digest go to technical_detail only.
  params: [packages]
  match:
    - {kind: regex, value: "This modeling file requires the following packages that were not found in your environment"}
    - {kind: regex, value: "ModuleNotFoundError: No module named '[^']+'|ImportError: No module named '?[A-Za-z0-9_.]+'?"}
  actions:
    - {id: use_app_environment, kind: navigate, target: settings_environment, confirm: false}
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

GPU-001:
  slug: GPU_ENV_INCOMPATIBLE
  severity: error
  prevent_in_preflight: true
  # Preflight (D-4): a GeForce card (no CUDA forward compatibility) with a driver older than the image's CUDA needs.
  params: [driver_version, min_driver]
  match:
    - {kind: regex, value: "libcudart\\.so\\.12|libcublas\\.so\\.12|no kernel image is available|torch .*\\+cpu"}
    - {kind: preflight, value: GPU_ENV}
  actions:
    - {id: use_app_environment, kind: navigate, target: settings_environment, confirm: false}
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

GPU-002:
  slug: GPU_COMPILE_FAILED
  severity: error
  prevent_in_preflight: false
  params: [checkpoint_step, {name: resumable, type: bool}]
  match:
    - {kind: regex, value: "sm_121a?'? is not defined|ptxas fatal|PermissionError: \\[Errno 13\\] Permission denied: ''"}
  actions:
    - {id: disable_compile, kind: patch, patch: [{param: torch_compile, op: set, value: false}], confirm: false}
    - {id: resume_checkpoint, kind: resume, confirm: true, when: {resumable: true}}
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

GPU-003:
  slug: QUANT_SLOW_ON_DEVICE
  severity: warn
  prevent_in_preflight: true
  params: []
  match:
    - {kind: validate, value: "quantize.format == nvfp4 and device capability == (12, 1)"}
  actions:
    - {id: switch_fp8, kind: patch, patch: [{param: format, op: set, value: fp8}], confirm: false}
    - {id: keep_nvfp4, kind: navigate, target: dismiss, confirm: false}

DATA-001:
  slug: DATA_IMAGE_TOKEN_MISMATCH
  severity: error
  prevent_in_preflight: true
  params: [idx, image_count, slot_count]
  match:
    - {kind: regex, value: "Image features and image tokens do not match"}
  actions:
    - {id: view_bad_samples, kind: navigate, target: data_samples, confirm: false}
    - {id: skip_bad_samples, kind: patch, patch: [{param: skip_invalid_samples, op: set, value: true}], confirm: false}
    - {id: increase_max_length, kind: patch, patch: [{param: max_seq_len, op: scale, value: 2.0}], confirm: false}

DATA-002:
  slug: DATA_BAD_IMAGE
  severity: warn
  prevent_in_preflight: true
  params: [image_count]
  match:
    - {kind: regex, value: "UnidentifiedImageError|cannot identify image file"}
  actions:
    - {id: auto_convert_images, kind: patch, patch: [{param: convert_images_rgb, op: set, value: true}], confirm: false}
    - {id: skip_bad_samples, kind: patch, patch: [{param: skip_invalid_samples, op: set, value: true}], confirm: false}
    - {id: view_bad_samples, kind: navigate, target: data_samples, confirm: false}

DATA-003:
  slug: DATA_NO_LEARNING_SIGNAL
  severity: warn
  prevent_in_preflight: true
  params: []
  match:
    - {kind: executor, value: "loss < 0.01 at first logged step or trainable label ratio == 0"}
  actions:
    - {id: check_sample_data, kind: navigate, target: data_samples, confirm: false}
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

DATA-004:
  slug: DATA_MISSING_IMAGE
  severity: error
  prevent_in_preflight: true
  params: [sample_count]
  match:
    - {kind: validate, value: "dataset image path does not exist"}
  actions:
    - {id: view_bad_samples, kind: navigate, target: data_samples, confirm: false}
    - {id: skip_bad_samples, kind: patch, patch: [{param: skip_invalid_samples, op: set, value: true}], confirm: false}

DATA-005:
  slug: TRIAL_IMAGE_UNUSABLE
  severity: error
  prevent_in_preflight: true
  # The image of a trial-inference node ("Chạy thử", serve.vllm) cannot be used (bao-security rules, serve/trial.py):
  # missing, not a regular file under uploads/, > 20 MB, > 40 MP, or not a readable PNG/JPEG/WEBP.
  params:
    - {name: node, ref: node}
    - {name: reason, type: enum, values: [missing, not_a_file, too_large, too_many_pixels, unreadable]}
  variants:
    - {when: {reason: missing}, key: missing}
    - {when: {reason: [not_a_file, unreadable]}, key: unreadable}
    - {when: {reason: too_large}, key: too_large}
    - {when: {reason: too_many_pixels}, key: too_many_pixels}
  match:
    - {kind: executor, value: "app/workers.py RealWorker._serve image checks + serve/trial.py TrialInputError"}
  actions:
    - {id: open_node, kind: navigate, target: "node:self", confirm: false}

DATA-006:
  slug: LOCAL_DATASET_INVALID
  severity: error
  prevent_in_preflight: false
  # B-3b data.local_folder: the scan of the user's folder (labels.jsonl + images) found unusable lines. The full list
  # (max 50) is in run_dir/problems.json. first_line is the 1-based labels.jsonl line (0 when the problem is the file
  # itself). The 16 scan reasons map to 7 texts: say what to fix, not the parser's name for it.
  params:
    - {name: node, ref: node}
    - problem_count
    - first_line
    - name: first_reason
      type: enum
      values: [labels_missing, labels_not_a_file, labels_too_large, not_json, bad_keys, bad_image_name, empty_target,
               bad_prompt, duplicate_image, image_missing, image_not_a_file, image_too_large, image_too_many_pixels,
               image_unreadable, image_too_big_side, no_samples]
  variants:
    - {when: {first_reason: [labels_missing, labels_not_a_file, labels_too_large]}, key: labels_file}
    - {when: {first_reason: [not_json, bad_keys, empty_target, bad_prompt]}, key: line_format}
    - {when: {first_reason: [bad_image_name, duplicate_image]}, key: image_name}
    - {when: {first_reason: [image_missing, image_not_a_file]}, key: image_missing}
    - {when: {first_reason: [image_too_large, image_too_many_pixels, image_too_big_side]}, key: image_too_large}
    - {when: {first_reason: image_unreadable}, key: image_unreadable}
    - {when: {first_reason: no_samples}, key: no_samples}
  match:
    - {kind: executor, value: "app/workers.py data.local_folder scan (B-3b)"}
  actions:
    - {id: pick_workspace_folder, kind: navigate, target: folder_picker, confirm: false}


DATA-007:
  slug: HELDOUT_DATA_IN_TRAINING
  severity: error
  prevent_in_preflight: true
  # Benchmark test data extracted to files lives under data/eval/ (e.g. OCRBench for the vLLM gate). A data.local_folder
  # reading it (symlinks followed) must never reach a fine-tune node's train_data/val_data or a quantize node's
  # calib_data, through any data step: scores on that benchmark would be meaningless. node = the folder node;
  # target_node = the fine-tune / quantize node that would use it.
  params:
    - {name: node, ref: node}
    - {name: target_node, ref: node}
  match:
    - {kind: validate, value: "data.local_folder under data/eval/ reaches train_data/val_data/calib_data (nodes/rules.py)"}
    - {kind: executor, value: "app/workers.py RealWorker._train guard, before run_job (common/heldout_data.py)"}
  actions:
    - {id: pick_workspace_folder, kind: navigate, target: folder_picker, confirm: false}

DATA-009:
  slug: DATASET_HAS_SCRIPT
  severity: error
  prevent_in_preflight: true
  # ADR-021 §4: a dataset repo that is loaded by its own Python script is never run (only parquet / arrow / json /
  # imagefolder). has_parquet_export: the hub's automatic parquet conversion exists for it.
  params: [repo, {name: has_parquet_export, type: bool}]
  variant_by: has_parquet_export
  match:
    - {kind: executor, value: "hub dataset resolver: loading script in the repo (ADR-021 §4)"}
  actions:
    # The hub's own parquet conversion branch; inspect pins it to a 40-char sha like any revision (P021 §Inspect).
    - {id: use_parquet_export, kind: patch, patch: [{param: revision, op: set, value: refs/convert/parquet}], confirm: false, when: {has_parquet_export: true}}
    - {id: fix_repo_id, kind: navigate, target: "node:self", confirm: false}

DATA-010:
  slug: DATASET_COLUMNS_MISSING
  severity: error
  prevent_in_preflight: true
  # ADR-021 §4: the column mapping lacks a role the node needs. available = up to 10 column names (each <= 64 chars),
  # comma-separated, from the dataset's features.
  params:
    - repo
    - {name: missing, type: enum, values: [image, question, answer, messages]}
    - available
  variant_by: missing
  match:
    - {kind: validate, value: "hub dataset column mapping: required role unmapped (ADR-021 §4)"}
  actions:
    - {id: open_column_mapping, kind: navigate, target: column_mapping, confirm: false}

DATA-011:
  slug: DATASET_COLUMN_TYPE
  severity: error
  prevent_in_preflight: true
  # ADR-021 §4: a mapped column has the wrong feature type for its role (e.g. an image role on a string column).
  # expected / found are column-kind ids (image, text, number, messages, list, other) rendered as words (byo.kind);
  # an unknown kind renders as byo.kind.other.
  params:
    - repo
    - column
    - {name: role, type: enum, values: [image, question, answer, messages], words: byo.role}
    - {name: expected, words: byo.kind}
    - {name: found, words: byo.kind}
  match:
    - {kind: validate, value: "hub dataset column mapping: feature type does not fit the role (ADR-021 §4)"}
  actions:
    - {id: open_column_mapping, kind: navigate, target: column_mapping, confirm: false}

MODEL-001:
  slug: CKPT_LOAD_KEY_MISMATCH
  severity: error
  prevent_in_preflight: false
  params: []
  match:
    - {kind: regex, value: "Missing key\\(s\\)|Unexpected key\\(s\\)|size mismatch for|KeyError: '?model\\.(language_model\\.)?visual"}
  actions:
    - {id: retry_recommended_version, kind: patch, confirm: true}
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

MODEL-002:
  slug: MODEL_VERIFY_FAILED
  severity: error
  prevent_in_preflight: false
  params: []
  match:
    - {kind: executor, value: "verify node: missing keys or logits cosine < 0.999"}
  actions:
    - {id: view_comparison, kind: navigate, target: verify_report, confirm: false}
    - {id: use_original_model, kind: patch, confirm: true}
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

MODEL-003:
  slug: MODEL_ARCH_UNSUPPORTED
  severity: error
  prevent_in_preflight: true
  # ADR-021: config.json (parsed as JSON only, never imported) names an architecture the training image has no native
  # support for. architecture / model_type are sanitized by the resolver (<= 80 chars, [A-Za-z0-9_.-], "unknown" when
  # absent); revision = the pinned commit, 12 chars.
  params: [repo, revision, architecture, model_type]
  match:
    - {kind: executor, value: "hub resolver: architectures[0] / model_type not in the supported family table (ADR-021)"}
  actions:
    - {id: request_catalog, kind: navigate, target: request_catalog, confirm: false}
    - {id: pick_other_asset, kind: navigate, target: "node:self", confirm: false}

MODEL-004:
  slug: MODEL_NEEDS_REMOTE_CODE
  severity: error
  prevent_in_preflight: true
  # ADR-021 §3 (user decision): a model added by the user that needs trust_remote_code is blocked; only catalog models
  # (each .py file pinned by hash after review) may run their own code. The user can ask for it to be added.
  # reason unreadable_config: a config / tokenizer / processor json is over the size cap, so remote code cannot be ruled
  # out; blocked the same way (security). file = that file's name (sanitized by the resolver).
  params:
    - repo
    - revision
    - {name: reason, type: enum, values: [remote_code, unreadable_config]}
    - file
  variant_by: reason
  match:
    - {kind: executor, value: "hub resolver: auto_map / custom code in config.json (ADR-021 §3)"}
  actions:
    - {id: request_catalog, kind: navigate, target: request_catalog, confirm: false}
    - {id: pick_other_asset, kind: navigate, target: "node:self", confirm: false}

MODEL-005:
  slug: MODEL_UNVERIFIED_TRY_FIRST
  severity: info
  prevent_in_preflight: false
  # ADR-021 / design spec H §2: a train step on a user-added model with no completed quick trial run yet. A hint, never
  # a block. run_smoke = a server-side trial run of that step (POST /api/runs {workflow, trial: {node}}), params kept.
  params:
    - {name: node, ref: node}
    - model
  match:
    - {kind: validate, value: "train step on a user-added model without a completed trial run (ADR-021)"}
  actions:
    - {id: run_smoke, kind: trial, confirm: false}

NET-001:
  slug: DOWNLOAD_FAILED
  severity: error
  prevent_in_preflight: true
  params: [{name: reason, type: enum, values: [gated, auth, network]}, checkpoint_step, {name: resumable, type: bool}]
  match:
    - {kind: regex, value: "GatedRepoError|401 Client Error|403 Client Error|ConnectionError|LocalEntryNotFoundError|ReadTimeout"}
  actions:
    - {id: check_connection, kind: navigate, target: settings_network, confirm: false}
    - {id: enter_token, kind: navigate, target: settings_secrets, confirm: false}
    - {id: resume_checkpoint, kind: resume, confirm: true, when: {resumable: true}}

NET-002:
  slug: NOT_DOWNLOADED
  severity: error
  prevent_in_preflight: true
  # app/workers.py NotCachedError: jobs run offline, so a model or dataset must already be in the project cache. Not a
  # network or sign-in problem (that is NET-001, PM 2026-10-13). not_prepared: downloaded, but a model that needs a
  # preparation step (prepared snapshot) has not had it; not_pinned: a dataset outside the vetted catalog (never
  # downloaded by the app). download = G-5 (backend); until its handler exists the UI hides the button (G-3 rule).
  # Severity error is the run's (NotCachedError); validate emits it as warn (P018 §3.1, rule
  # catalog_assets_on_this_machine) so Run stays enabled and the UI offers "download all missing". The UI colours by
  # issue.severity, like DATA-006.
  # catalog_id + kind feed the download API (POST /api/downloads {kind, catalog_id}: the server resolves repo, revision
  # and include from the catalog, a client never sends a repo); size_gb shows the download size on the card.
  params:
    - repo
    - {name: reason, type: enum, values: [not_cached, not_prepared, not_pinned]}
    - catalog_id
    - {name: kind, type: enum, values: [model, dataset]}
    - size_gb
    - name  # catalog display_name: the "download before running" dialog lists each missing item ...
    - license  # ... with its licence id (datasets have no option_meta to read it from)
  variant_by: reason
  match:
    - {kind: executor, value: "app/workers.py NotCachedError"}
  actions:
    - {id: download, kind: navigate, target: download_asset, confirm: false, when: {reason: [not_cached, not_prepared]}}
    - {id: pick_other_asset, kind: navigate, target: "node:self", confirm: false}

NET-003:
  slug: DOWNLOAD_INTEGRITY
  severity: error
  prevent_in_preflight: false
  # download/install.py: a staged file does not match the hub's LFS sha256, the security pin (remote code) or the
  # job's own plan (extra, missing, a link, a disallowed type). Nothing is installed; name = the asset's display name.
  # cached_differs: the snapshot already in the cache differs from the hub at the same revision (security D3): it is
  # neither used nor overwritten; the user removes it from the Storage panel.
  params: [name, {name: reason, type: enum, values: [mismatch, cached_differs]}]
  variant_by: reason
  match:
    - {kind: executor, value: "download/install.py DownloadIntegrityError"}
  actions:
    - {id: download, kind: navigate, target: download_asset, confirm: false}
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

NET-004:
  slug: DOWNLOAD_QUOTA
  severity: error
  prevent_in_preflight: true
  # The planned size is over the download limit (Settings quota, admin policy [download] max_gb). size_gb / quota_gb
  # in GB, one decimal. Checked before the job starts (catalog size) and on the job's plan (security download §5).
  params: [size_gb, quota_gb]
  match:
    - {kind: executor, value: "download quota check before the job and on its plan"}
  actions:
    - {id: pick_other_asset, kind: navigate, target: "node:self", confirm: false}

NET-005:
  slug: HUB_REPO_UNAVAILABLE
  severity: error
  prevent_in_preflight: true
  # ADR-021 (bring your own model / dataset): the Hugging Face repo the user pasted cannot be read. HF answers 401 for a
  # private repo AND an unknown one when no token is stored, hence not_found_or_private. repo is sanitized by the
  # resolver (HF id syntax); kind = model | dataset.
  params:
    - repo
    - {name: kind, type: enum, values: [model, dataset]}
    - {name: reason, type: enum, values: [not_found, not_found_or_private, gated_no_token, gated_not_accepted, network]}
  variant_by: reason
  match:
    - {kind: executor, value: "hub resolver: repo_info 404 / 401 / 403 / connection error (ADR-021)"}
  actions:
    - {id: enter_token, kind: navigate, target: settings_secrets, confirm: false, when: {reason: [not_found_or_private, gated_no_token]}}
    - {id: open_hub_page, kind: navigate, target: hub_page, confirm: false, when: {reason: gated_not_accepted}}
    - {id: check_connection, kind: navigate, target: settings_network, confirm: false, when: {reason: network}}
    - {id: fix_repo_id, kind: navigate, target: "node:self", confirm: false}

CFG-001:
  slug: GRAPH_PORT_TYPE_MISMATCH
  severity: error
  prevent_in_preflight: true
  params: [{name: a, ref: node}, {name: b, ref: node}, {name: type_a, ref: port_type}, {name: type_b, ref: port_type}]
  match:
    - {kind: validate, value: "edge port types incompatible"}
  actions:
    - {id: preview_converter, kind: patch, confirm: true}
    - {id: show_guide, kind: navigate, target: docs_port_types, confirm: false}

CFG-002:
  slug: GRAPH_CYCLE
  severity: error
  prevent_in_preflight: true
  params: [{name: nodes, ref: node_list}]
  match:
    - {kind: validate, value: "cycle detected"}
  actions:
    - {id: show_cycle, kind: navigate, target: highlight_cycle, confirm: false}

CFG-003:
  slug: INPUT_MISSING
  severity: error
  prevent_in_preflight: true
  params: [{name: node, ref: node}, {name: port, ref: port}]
  match:
    - {kind: validate, value: "required input port unconnected"}
  actions:
    - {id: pick_input_source, kind: navigate, target: "node:port", confirm: false}

CFG-004:
  slug: NODE_TYPE_UNKNOWN
  severity: error
  prevent_in_preflight: true
  # suggested_package / name_lookalike_of / trust_level are computed by the SERVER from the app registry
  # (P003 D16): any package/URL/trust hint inside the workflow is only a lookup key, never echoed.
  params:
    - node_type
    - {name: reason, type: enum, values: [not_installed, not_allowed]}
    - {name: trust_level, type: enum, values: [first_party, reviewed, unverified]}
    - suggested_package
    - name_lookalike_of
  variants:
    - {when: {reason: not_installed, trust_level: [first_party, reviewed]}, key: not_installed_trusted}
    - {when: {reason: not_installed, trust_level: unverified}, key: not_installed_unknown}
    - {when: {reason: not_allowed}, key: not_allowed}
  match:
    - {kind: validate, value: "node type not installed or not allowed"}
  actions:
    - {id: review_to_install, kind: navigate, target: node_install_dialog, confirm: false, when: {reason: not_installed}}
    - {id: remove_step, kind: patch, confirm: true}
    - {id: replace_step, kind: patch, confirm: true}

CFG-005:
  slug: PARAM_INVALID
  severity: error
  prevent_in_preflight: true
  # key: the dotted engine option inside `advanced` (P016 §3, one issue per bad key; "" when the key has no valid shape,
  # never echoed). rule for advanced: type | range | choice | resolver | not_offered | too_many | not_for_model.
  params: [{name: node, ref: node}, {name: param, ref: param}, value, rule, key]
  # Variants in order (first match): advanced option texts by rule, the generic advanced text when the key is empty
  # or the rule unknown (every advanced_* text names {key}), and the original text for every other param (bao-design).
  variants:
    - {when: {param: advanced, rule: too_many}, key: advanced_too_many}
    - {when: {param: advanced, key: ""}, key: advanced}
    - {when: {param: advanced, rule: type}, key: advanced_type}
    - {when: {param: advanced, rule: range}, key: advanced_range}
    - {when: {param: advanced, rule: choice}, key: advanced_choice}
    - {when: {param: advanced, rule: resolver}, key: advanced_resolver}
    - {when: {param: advanced, rule: not_offered}, key: advanced_not_offered}
    - {when: {param: advanced, rule: not_for_model}, key: advanced_not_for_model}
    - {when: {param: advanced}, key: advanced}
    - {when: {param: quantize_base, rule: not_for_model}, key: qlora_not_for_model}
    - {when: {}, key: default}
  match:
    - {kind: validate, value: "node params ValidationError"}
    # Runtime guard from AutoModel patch 0002: trainable share outside the recipe's expectation (freeze did not
    # apply as intended) -> params {param: freeze_config, rule: trainable_pct}; the job stops before step 1.
    - {kind: regex, value: "VLM_TRAINABLE_PCT_MISMATCH"}
    - {kind: regex, value: "freeze_config has unknown keys"}
  actions:
    - {id: reset_default, kind: patch, confirm: false}

CFG-006:
  slug: EDGE_DANGLING
  severity: error
  prevent_in_preflight: true
  params: [node_id]
  match:
    - {kind: validate, value: "edge endpoint node missing"}
  actions:
    - {id: remove_bad_wire, kind: patch, confirm: true}

CFG-007:
  slug: WORKFLOW_FILE_INVALID
  severity: error
  prevent_in_preflight: true
  # reason: parse | schema | invalid_identifier (node_type/publisher/package must match ^[a-z0-9][a-z0-9_.-]{0,63}$);
  # the offending VALUE is never echoed, only the field name.
  params: [field, reason]
  match:
    - {kind: validate, value: "workflow parse/schema error or invalid identifier"}
  actions:
    - {id: open_other_file, kind: navigate, target: open_workflow, confirm: false}
    - {id: show_technical, kind: navigate, target: technical_details, confirm: false}

CFG-008:
  slug: NODE_ID_DUPLICATE
  severity: error
  prevent_in_preflight: true
  params: [node_id, duplicate_count]
  match:
    - {kind: validate, value: "duplicate node id"}
  actions:
    - {id: auto_rename_ids, kind: patch, confirm: true}

CFG-009:
  slug: NODE_VERSION_MISMATCH
  severity: error
  prevent_in_preflight: true
  params: [node_id, node_type, workflow_version, installed_version, {name: migratable, type: bool}]
  variant_by: migratable
  match:
    - {kind: validate, value: "NodeSpec version mismatch"}
  actions:
    - {id: migrate_node, kind: patch, confirm: true, when: {migratable: true}}
    - {id: open_node, kind: navigate, target: "node:self", confirm: false}

CFG-010:
  slug: MODEL_TRAIN_MODE_UNSUPPORTED
  severity: error
  prevent_in_preflight: true
  # The train node does not match the only mode the model catalog has tested (catalog `train_node`): e.g. LoRA on
  # Nemotron-Parse v1.1, whose recipe is full fine-tune only (FusedAdam fp32 master, no LoRA target modules).
  # node = the train node's id; model = catalog display_name; supported = catalog train_node.
  params:
    - {name: node, ref: node}
    - model
    - {name: supported, type: enum, values: [train.sft_vlm, train.lora_vlm, none]}
  variants:
    - {when: {supported: train.sft_vlm}, key: full_finetune_only}
    - {when: {supported: train.lora_vlm}, key: lora_only}
    - {when: {supported: none}, key: not_trainable}
  match:
    - {kind: validate, value: "train node type differs from the model catalog train_node"}
    - {kind: executor, value: "app/workers.py RealWorker._train guard, before run_job (no GPU lock taken)"}
  actions:
    - {id: switch_train_step, kind: patch, confirm: true, when: {supported: [train.sft_vlm, train.lora_vlm]}}
    - {id: pick_other_asset, kind: navigate, target: "node:model", confirm: false}

CFG-011:
  slug: NODE_NOT_RUNNABLE_YET
  severity: error
  prevent_in_preflight: true
  # The real (container) worker has no implementation for this node type yet (M1b B-0). Raised at validate only with
  # `--worker container` (the fake worker runs every node) and by the worker (NodeNotRunnableError) as a backstop.
  # node = the node's id; node_type is for logs/tests, not shown. reason (free, optional): why, when the app knows;
  # only reasons with their own text are variants (engine_single_gpu: GRPO, NeMo-RL has no 1-GPU VLM recipe yet,
  # PM 2026-10-14), every other reason (quantize/scope's format, remote_code_model...) reads the generic sentence.
  params: [{name: node, ref: node}, node_type, reason]
  variants:
    - {when: {reason: engine_single_gpu}, key: engine_single_gpu}
    - {when: {reason: engine_no_vlm_dpo}, key: engine_no_vlm_dpo}
    - {when: {}, key: generic}
  match:
    - {kind: validate, value: "node type has no real worker yet (container worker)"}
    - {kind: executor, value: "app/workers.py NodeNotRunnableError"}
  actions:
    - {id: remove_step, kind: patch, confirm: true}

CFG-012:
  slug: GROUP_INVALID
  severity: error
  prevent_in_preflight: true
  # A group (subgraph, P016) that cannot be expanded (graph/groups.py). group = the group id, "" when the definition
  # is not even valid (an arbitrary id from the file is never echoed); limit = the cap of the too_* reasons.
  params:
    - group
    - name: reason
      type: enum
      values: [invalid_definition, namespace, name_clash, bad_mapping, recursion, too_deep, too_many_nodes,
               too_many_edges, too_many_definitions, id_too_long]
    - limit
  variant_by: reason
  match:
    - {kind: validate, value: "group expansion failed (graph.groups)"}
  actions:  # only reasons anchored on a group node; the others are about the whole file (no node to open)
    - {id: open_node, kind: navigate, target: "node:self", confirm: false, when: {reason: [bad_mapping, recursion, too_deep, id_too_long]}}

EXP-001:
  slug: EXPORT_LICENSE_TEXT_MISSING
  severity: error
  prevent_in_preflight: true
  # An exported model must ship the full text of every component license (ADR-012); the app has no APPROVED text for
  # these license ids (export/notices.py LicenseTextMissingError). Not the user's fault: app content to fix.
  params: [license_ids]
  match:
    - {kind: validate, value: "export notices: a component license has no approved text"}
    - {kind: executor, value: "export/notices.py LicenseTextMissingError"}
  actions:
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

EXP-002:
  slug: MODEL_EXPORT_UNSUPPORTED
  severity: error
  prevent_in_preflight: true
  # export.hf_dir of a model whose catalog remote_code != none (Nemotron-Parse): its exported folder would need the
  # pinned remote code resolved outside this app (B3). node = the export node's id; model = catalog display_name.
  params: [{name: node, ref: node}, model]
  match:
    - {kind: validate, value: "export.hf_dir below a model with remote_code != none"}
    - {kind: executor, value: "export worker guard before writing the export dir"}
  actions:
    - {id: remove_step, kind: patch, confirm: true}
    - {id: pick_other_asset, kind: navigate, target: "node:model", confirm: false}

EXP-003:
  slug: EXPORT_CONTAINS_SECRET
  severity: error
  prevent_in_preflight: false
  # The export folder failed the secret scan (common/secret_scan.py) before anything left the run dir (bao-security,
  # blocking). files = the file NAMES only, joined with ", "; the matched string is never put in params, logs or UI.
  params: [{name: node, ref: node}, files]
  match:
    - {kind: executor, value: "app/export_worker.py secret_scan before publish"}
  actions:
    - {id: open_node, kind: navigate, target: "node:self", confirm: false}
    # Safe to report: the record carries file names and the pattern type only, never the matched value.
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

EXP-004:
  slug: EXPORT_INCOMPLETE
  severity: error
  prevent_in_preflight: false
  # The export folder lacks what makes it a model (config.json, *.safetensors), e.g. an HF snapshot whose links
  # could not be followed: never reported completed (tester, release 1.0). files = the missing names, ", ".
  params: [{name: node, ref: node}, files]
  match:
    - {kind: executor, value: "app/export_worker.py completeness check before publish"}
  actions:
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

SEC-001:
  slug: PATH_OUTSIDE_WORKSPACE
  severity: error
  prevent_in_preflight: true
  params: [path]
  match:
    - {kind: validate, value: "resolved path not under workspace root"}
  actions:
    - {id: pick_workspace_folder, kind: navigate, target: folder_picker, confirm: false}

SEC-002:
  slug: SECRET_IN_WORKFLOW
  severity: error
  prevent_in_preflight: true
  params: [param]
  match:
    - {kind: validate, value: "secret-like value in node params (value never stored or echoed)"}
  actions:
    - {id: move_to_secure_settings, kind: navigate, target: settings_secrets, confirm: false}

SEC-003:
  slug: LICENSE_BLOCKED
  severity: error
  prevent_in_preflight: true
  params: [name, use]
  match:
    - {kind: validate, value: "license check (configs/security/licenses.yaml)"}
  actions:
    - {id: pick_other_asset, kind: navigate, target: "node:asset", confirm: false}

SEC-004:
  slug: IMAGE_DIGEST_MISMATCH
  severity: error
  prevent_in_preflight: true
  # The local tag no longer points at the image id pinned in docker/IMAGES.lock (security D1/D16
  # image_digest_mismatch): someone rebuilt/retagged it outside the app. Fail closed, nothing is run.
  # expected/actual are digests for the report, not shown in the message.
  params: [image, expected, actual]
  match:
    - {kind: executor, value: "common/images.py ImageMismatchError (run_job, preflight): tag -> image id != IMAGES.lock"}
  actions:
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

SEC-005:
  slug: LICENSE_NOT_CONFIRMED
  severity: error
  prevent_in_preflight: true
  # ADR-021: a model / dataset the user added is downloaded only after the user confirmed its licence (shown from the
  # model card; "unknown" when the card names none). name = display name, repo = HF id, license = licence id.
  # catalog_id + kind: the user asset the licence dialog opens on (frontend needs both to show the button).
  params: [name, repo, license, catalog_id, {name: kind, type: enum, values: [model, dataset]}]
  match:
    - {kind: validate, value: "user-added asset without a licence confirmation (ADR-021)"}
  actions:
    - {id: confirm_license, kind: navigate, target: license_dialog, confirm: false}

CACHE-001:
  slug: CACHE_ARTIFACT_INVALID
  severity: warn
  prevent_in_preflight: false
  params: [node, saved_at, est_minutes]
  match:
    - {kind: executor, value: "cache hit but artifact path missing or manifest hash mismatch -> treated as miss"}
  actions: []

QNT-001:
  slug: QUANT_PARITY_FAIL
  severity: error
  prevent_in_preflight: false
  # quantize.ptq parity verdict "fail" (exit 10 + report.json; thresholds come from report["parity"]["thresholds"]).
  # top1_pct / limit_top1_pct = mean top-1 agreement with the BF16 model on held-out images, in percent (one decimal).
  # The quantized model is NOT handed over. Research: .team/proposals/001-stack-model-catalog.md (B-4 A/B).
  params:
    - {name: node, ref: node}
    - top1_pct
    - limit_top1_pct
    - kl
    - limit_kl
    - sample_count
    - {name: reason, type: enum, values: [top1, kl]}  # which limit tripped; top1 when both did
  variants:
    - {when: {reason: top1}, key: top1}
    - {when: {reason: kl}, key: kl}
  match:
    - {kind: exit, value: "10 (ExitCode.QUANT_PARITY_FAIL) and report.json parity verdict fail"}
  actions:
    - {id: remove_step, kind: patch, confirm: true}
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

QNT-002:
  slug: QUANT_PARITY_LOW
  severity: warn
  prevent_in_preflight: false
  # quantize.ptq parity verdict "warn": below the typical FP8 level but not broken; the model IS handed over.
  # Same params as QNT-001 with the warn thresholds. Export adds a NOTICE line when no benchmark follows (PM).
  params:
    - {name: node, ref: node}
    - top1_pct
    - limit_top1_pct
    - kl
    - limit_kl
    - sample_count
    - {name: reason, type: enum, values: [top1, kl]}  # which limit tripped; top1 when both did
  variants:
    - {when: {reason: top1}, key: top1}
    - {when: {reason: kl}, key: kl}
  match:
    - {kind: executor, value: "quantize report.json parity verdict warn"}

SYS-003:
  slug: WORKER_CRASHED
  severity: error
  prevent_in_preflight: false
  # Executor order: cancelled by executor (no error) > exit 75 (MEM-002) > 137 + OOMKilled (MEM-003)
  #   > error event code > other non-zero exit (SYS-003) > unknown exception (SYS-000)
  params: [node, exit_code, signal, checkpoint_step, {name: resumable, type: bool}]
  match:
    - {kind: exit, value: "nonzero without error event"}
  actions:
    - {id: resume_checkpoint, kind: resume, confirm: true, when: {resumable: true}}
    - {id: rerun_step, kind: resume, confirm: true}
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

SYS-005:
  slug: ATTEMPTS_EXHAUSTED
  severity: error
  prevent_in_preflight: false
  # P017 (PM 2026-10-13): each try of a node gets its own run dir, at most 10; an 11th failing try is a setup or system
  # problem, not bad luck. A "reset this step" action comes with the Storage panel feature (not offered before it exists).
  params: [node, attempt_count]
  match:
    - {kind: executor, value: attempts_exhausted}
  actions:
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}

SYS-000:
  slug: UNKNOWN_ERROR
  severity: error
  prevent_in_preflight: false
  params: [checkpoint_step, {name: resumable, type: bool}]
  match:
    - {kind: executor, value: fallback}
  actions:
    - {id: send_report, kind: navigate, target: bug_report, confirm: false}
    - {id: show_technical, kind: navigate, target: technical_details, confirm: false}
    - {id: resume_checkpoint, kind: resume, confirm: true, when: {resumable: true}}
