# DRAFT error copy (owner: bao-design). Moves into src/vlm_pipeline/i18n/{vi,en}.yaml as error.<CODE>.title|what|why
# once ADR for P009/P010 is accepted. Codes/match/actions live in fixcode's error_catalog.yaml.
# Placeholder convention: sizes *_gb, counts *_count; must match params[] in error_catalog.yaml.
# Rules: no placeholders in titles (node is highlighted on canvas); title VI ≤10 tokens (split), EN ≤8 words; what+why ≤2 sentences total; no paths/secrets/tracebacks; "bạn", no blame.

error:
  GPU-001:
    title: {vi: "Phần mềm không tương thích với GPU của máy", en: "Software doesn't match this GPU"}
    what:  {vi: "Một thành phần được cài cho phiên bản CUDA khác với bản máy này hỗ trợ.", en: "A component was built for a different CUDA version than this machine supports."}
  GPU-002:
    title: {vi: "Chế độ chạy nhanh không khởi động được", en: "Fast mode failed to start"}
    what:  {vi: "Phần tăng tốc chưa hỗ trợ chip GB10 nên không khởi động được; tắt nó thì bước vẫn chạy, chỉ chậm hơn.", en: "The speed-up component doesn't support the GB10 chip yet; turning it off lets the step run, just slower."}
  CACHE-001:
    title: {vi: "Kết quả cũ bị hỏng, sẽ chạy lại", en: "Saved result is damaged, re-running"}
    what:  {vi: "Kết quả đã lưu của bước \"{node}\" (lúc {saved_at}) không đọc được nên app sẽ chạy lại bước này, mất khoảng {est_minutes} phút.", en: "The saved result of \"{node}\" (from {saved_at}) can't be read, so the app will run this step again, about {est_minutes} minutes."}
  SYS-003:
    title: {vi: "Bước này dừng đột ngột", en: "This step stopped unexpectedly"}
    what:  {vi: "Bước này dừng giữa chừng mà không báo lý do (có thể do máy khởi động lại hoặc tiến trình bị tắt). Tiến độ đến {checkpoint_step} đã được lưu nếu có.", en: "This step stopped midway without reporting why (the machine may have restarted or the process was killed). Progress up to {checkpoint_step} was saved if available."}
  DISK-002:
    title: {vi: "Cần duyệt trước khi dọn dung lượng", en: "Approval needed before freeing space"}
    what:  {vi: "Bạn sắp xoá {gb} GB ({item_count} mục), vượt mức {threshold_gb} GB của máy dùng chung nên quản trị viên cần duyệt bằng lệnh. Chưa có gì bị xoá.", en: "You're about to delete {gb} GB ({item_count} items), above this shared machine's {threshold_gb} GB limit, so an admin must approve it with a command. Nothing has been deleted yet."}
  CFG-008:
    title: {vi: "Có hai bước trùng mã định danh", en: "Two steps share the same ID"}
    what:  {vi: "{duplicate_count} bước đang dùng chung mã \"{node_id}\", nên app không biết nối dây vào bước nào. Thường do sửa tay file workflow.", en: "{duplicate_count} steps share the ID \"{node_id}\", so the app can't tell which one the wires belong to. This usually comes from editing the workflow file by hand."}
  CFG-004:
    title: {vi: "Workflow dùng bước app không có", en: "Workflow uses a step the app lacks"}
    what:
      # variants (fixcode table, ordered): not_installed+first_party|reviewed → not_installed_trusted; not_installed+unverified → not_installed_unknown; not_allowed → not_allowed. suggested_package only from registry (null for unverified).
      not_installed_trusted: {vi: "Bước \"{node_type}\" là node bên thứ 3 chưa được cài trên máy này. Node có trong nguồn tin cậy của app; bạn xem thông tin rồi quyết định có cài không.", en: "\"{node_type}\" is a third-party node not installed on this machine. It is in the app's trusted sources; review it and decide whether to install."}
      not_installed_unknown: {vi: "Bước \"{node_type}\" là node bên thứ 3 không có trong nguồn tin cậy — workflow này do người khác chia sẻ. App không cài theo thông tin trong file.", en: "\"{node_type}\" is a third-party node not in trusted sources — this workflow was shared by someone else. The app won't install from details in the file."}
      not_allowed:   {vi: "Bước \"{node_type}\" không được phép dùng trên máy này.", en: "\"{node_type}\" is not allowed on this machine."}
  CFG-009:
    title: {vi: "Workflow tạo bằng phiên bản bước khác", en: "Workflow made with another step version"}
    what:
      migratable:     {vi: "Bước \"{node_id}\" được tạo với {node_type} bản {workflow_version}, máy này có bản {installed_version}. App có thể chuyển thiết lập sang bản mới; bạn xem thay đổi trước khi áp dụng.", en: "\"{node_id}\" was made with {node_type} {workflow_version}; this machine has {installed_version}. The app can move the settings to the new version; review the changes first."}
      not_migratable: {vi: "Bước \"{node_id}\" được tạo với {node_type} bản {workflow_version}, máy này có bản {installed_version} và không tự chuyển được. Mở bước để chỉnh lại thiết lập.", en: "\"{node_id}\" was made with {node_type} {workflow_version}; this machine has {installed_version} and it can't be converted automatically. Open the step to adjust its settings."}

action:
  migrate_node:      {vi: "Xem thay đổi và cập nhật", en: "Review changes and update"}
  open_node:         {vi: "Mở bước này", en: "Open this step"}
  review_to_install: {vi: "Xem để cài", en: "Review to install"}
  show_admin_command: {vi: "Xem lệnh cho quản trị viên", en: "Show admin command"}  # dialog shows {admin_command} with Copy button
  auto_rename_ids:   {vi: "Tự đặt lại mã cho các bước trùng", en: "Rename duplicate steps automatically"}
  rerun_step:        {vi: "Chạy lại bước này", en: "Run this step again"}
  resume_checkpoint: {vi: "Tiếp tục từ chỗ đã lưu", en: "Continue from saved progress"}
  send_report:       {vi: "Gửi báo cáo lỗi", en: "Send error report"}
